<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="База">
<meta name="theme-color" content="#26303A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>База заказов</title>
<style>
:root{
  --slab:#26303A; --slab-2:#1B242C;
  --lcd:#C9D4C5; --lcd-ink:#161E15; --lcd-dim:#5A6858;
  --bg:#E9ECEE; --surface:#FFFFFF;
  --ink:#13202A; --muted:#5E6B75; --hair:#D3D9DD;
  --signal:#0A6FB8; --danger:#B3261E;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- корпус прибора ---------- */
.rig{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;
  background:
    linear-gradient(180deg,#323E49 0%,#26303A 42%,#1E2831 100%);
  box-shadow:0 3px 14px rgba(0,0,0,.35)}
.plate{position:relative;border-radius:12px;padding:12px 13px 13px;
  background:
    repeating-linear-gradient(97deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(165deg,#3A4653 0%,#2B3641 55%,#222C35 100%);
  border:1px solid #47545F;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 8px rgba(0,0,0,.30)}
/* винты по углам */
.plate::before,.plate::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#8A98A4,#4B5762 60%,#39434D);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);top:7px}
.plate::before{left:7px} .plate::after{right:7px}

.rig-top{display:flex;align-items:baseline;justify-content:space-between;margin:0 14px 9px}
.rig-brand{font-size:10.5px;letter-spacing:.16em;color:#93A3B0;text-transform:uppercase}
.rig-date{font-size:11px;color:#7E909D;font-variant-numeric:tabular-nums}

/* ---------- жидкокристаллическое табло ---------- */
.lcd{border-radius:6px;padding:3px;
  background:linear-gradient(180deg,#171E24,#232D35);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.lcd-face{position:relative;border-radius:4px;padding:8px 11px 9px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,#D3DCCD 0%,#C4CFC0 55%,#B6C2B2 100%)}
.lcd-face::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px)}
.lcd-label{font:11px/1 ui-monospace,Menlo,monospace;color:#5F6D5D;letter-spacing:.08em}
.lcd-digits{margin:5px 0 2px;min-height:52px;display:flex;align-items:flex-end}
.lcd-digits svg{width:100%;height:auto;max-height:64px;display:block}
.lcd-sub{display:flex;gap:10px;border-top:1px solid rgba(22,30,21,.22);padding-top:6px}
.sub{flex:1;min-width:0}
.sub i{display:block;font:normal 9.5px/1.2 ui-monospace,Menlo,monospace;color:#66755F}
.sub b{display:block;font:600 13px/1.25 ui-monospace,Menlo,monospace;color:#1B2419;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b.cut{color:#7A4A12}

/* ---------- поворотный регулятор ---------- */
.accbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.accbar .chip{border:1px solid #47545F;background:#222C35;color:#C7D5E0;border-radius:7px;
  padding:6px 9px;font-size:12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.accbar .chip b{color:#F2B441;font-variant-numeric:tabular-nums}
.accbar .chip.net b{color:#8FD694}
.knobrow{display:flex;align-items:center;gap:13px;margin-top:11px}
.knob{width:108px;height:108px;flex:none;touch-action:none;cursor:grab}
.knob:active{cursor:grabbing}
.knob svg{width:100%;height:100%;display:block}
.knob:focus-visible{outline:2px solid #7FB7E0;outline-offset:3px;border-radius:50%}
.knobinfo{min-width:0}
.knobcap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#93A3B0}
.knobval{font:600 26px/1.15 ui-monospace,Menlo,monospace;color:#F2B441;
  font-variant-numeric:tabular-nums;margin:1px 0 3px}
.knobhint{font-size:11px;color:#7E909D;line-height:1.3}

.empty{padding:52px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:17px}
.line{background:var(--surface);border-bottom:1px solid var(--hair);padding:11px 14px;display:flex;gap:11px}
.line-idx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  padding-top:3px;min-width:17px;font-variant-numeric:tabular-nums}
.line-main{flex:1;min-width:0}
.line-name{font-size:15px;line-height:1.3;margin-bottom:2px}
.line-cat{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.line-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:19px;color:var(--signal);line-height:1}
.stepper button:active{background:#EAF3FA}
.stepper span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);height:38px;line-height:38px}
.price-edit{border:1px solid var(--hair);border-radius:7px;padding:0 9px;height:38px;width:92px;
  text-align:right;font-variant-numeric:tabular-nums;background:#FBFCFC;-webkit-appearance:none}
.price-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.mult{color:var(--muted);font-size:14px}
.line-sum{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.line-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.wlab{font-size:11.5px;color:var(--muted)}
.wsel{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 6px;background:#FBFCFC}
.cost-edit{border:1px solid var(--hair);border-radius:7px;height:34px;width:78px;padding:0 8px;
  text-align:right;background:#FFF6E5;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.cost-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.wnow{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 9px;
  font-size:12.5px;color:var(--signal);background:#fff;font-variant-numeric:tabular-nums}
.mini:active{background:#EAF3FA}
.seg{flex:1;height:38px;border:1px solid var(--hair);border-radius:8px;background:#fff;font-size:14.5px}
.seg.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.line-del{align-self:flex-start;width:32px;height:32px;color:var(--muted);font-size:20px;line-height:1}
.line-del:active{color:var(--danger)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--hair);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.btn{min-height:var(--tap);border-radius:9px;padding:0 15px;font-size:15.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-main{background:var(--signal);color:#fff;flex:1}
.btn-main:active{background:#095C99}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);background:#fff}
.btn-ghost:active{background:#F1F4F6}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--hair);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.sheet-row{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.sheet-h{flex:1;font-size:16px;font-weight:600}
.search{flex:1;height:var(--tap);border:1px solid var(--hair);border-radius:9px;padding:0 12px;
  background:#F4F6F7;-webkit-appearance:none}
.search:focus{background:#fff;border-color:var(--signal);outline:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body-in{max-width:560px;margin:0 auto;padding-bottom:30px}
.crumb{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);font-size:13px;
  background:#DFE4E7;position:sticky;top:0}
.crumb button{color:var(--signal);font-size:14px;min-height:32px}
.opt{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:center;min-height:var(--tap)}
.opt:active{background:#EAF3FA}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:15px;line-height:1.3}
.opt-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt-p{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-cnt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.opt.hit{background:#DCEFD8}
.opt.act .opt-t{color:var(--signal)}
.none{padding:38px 22px;text-align:center;color:var(--muted)}

.screen{display:block}
.screen.off{display:none}
.bar.off{display:none}
.fhead{background:linear-gradient(180deg,#323E49,#242E38);color:#DCE3E8;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.28)}
.fhead-top{display:flex;align-items:baseline;justify-content:space-between;
  max-width:560px;margin:0 auto 9px}
.fkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;max-width:560px;
  margin:0 auto;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;text-align:left}
.fkpi div{background:#1F2831;padding:9px 10px;min-width:0}
.fkpi i{display:block;font:normal 10px/1.2 inherit;color:#8798A4;white-space:nowrap}
.fkpi b{display:block;font:600 16px/1.25 ui-monospace,Menlo,monospace;color:#E4EBF0;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fkpi b.good{color:#8FD694}
.ford{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:flex-start;min-height:var(--tap)}
.ford:active{background:#EAF3FA}
.ford-main{flex:1;min-width:0}
.ford-t{font-size:15.5px;display:flex;align-items:center;gap:7px}
.ford-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.ford-r{text-align:right;white-space:nowrap}
.ford-sum{font:600 15px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ford-st{font-size:10.5px;margin-top:3px}
.lock{position:fixed;inset:0;z-index:90;background:var(--slab);display:flex;
  align-items:center;justify-content:center;padding:24px}
.lock.off{display:none}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-t{color:#C7D5E0;font-size:15px;margin-bottom:16px}
.lock-dots{display:flex;gap:13px;justify-content:center;margin-bottom:8px;height:15px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #7E909D;display:block}
.lock-dots i.on{background:#F2B441;border-color:#F2B441}
.lock-err{color:#F2857A;font-size:12.5px;height:18px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{height:62px;border-radius:12px;background:#333F4B;color:#E4EBF0;font-size:22px;
  border:1px solid #47545F;font-variant-numeric:tabular-nums}
.pad button:active{background:#44525F}
.pad button.wide{grid-column:span 1;font-size:15px}
.stdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--hair)}
.chip2{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:8px 12px;
  font-size:14px;min-height:38px}
.chip2.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  border-bottom:1px solid var(--hair)}
.kpi{background:var(--surface);padding:11px 13px}
.kpi i{display:block;font:normal 11px/1.2 inherit;color:var(--muted);margin-bottom:3px}
.kpi b{display:block;font:600 19px/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi b.good{color:#1B6E2B} .kpi b.bad{color:#9A3412}
.tsec{padding:13px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}
.trow{display:flex;gap:10px;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:10px 14px;align-items:baseline}
.trow span{flex:1;min-width:0;font-size:14px}
.trow em{font-style:normal;font-size:12px;color:var(--muted)}
.trow b{font:600 14px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.dates{display:flex;gap:9px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--hair)}
.dates input{flex:1;border:1px solid var(--hair);border-radius:8px;padding:9px 10px;background:#FBFCFC}
.fld{background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--hair);border-radius:8px;
  padding:9px 10px;background:#FBFCFC;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--signal);background:#fff;outline:none}

.grp{padding:14px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}

  margin:0 auto;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;text-align:left}
.fkpi div{background:#1F2831;padding:9px 10px;min-width:0}
.fkpi i{display:block;font:normal 10px/1.2 inherit;color:#8798A4;white-space:nowrap}
.fkpi b{display:block;font:600 16px/1.25 ui-monospace,Menlo,monospace;color:#E4EBF0;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fkpi b.good{color:#8FD694}
.ford{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:flex-start;min-height:var(--tap)}
.ford:active{background:#EAF3FA}
.ford-main{flex:1;min-width:0}
.ford-t{font-size:15.5px;display:flex;align-items:center;gap:7px}
.ford-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.ford-r{text-align:right;white-space:nowrap}
.ford-sum{font:600 15px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ford-st{font-size:10.5px;margin-top:3px}
.lock{position:fixed;inset:0;z-index:90;background:var(--slab);display:flex;
  align-items:center;justify-content:center;padding:24px}
.lock.off{display:none}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-t{color:#C7D5E0;font-size:15px;margin-bottom:16px}
.lock-dots{display:flex;gap:13px;justify-content:center;margin-bottom:8px;height:15px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #7E909D;display:block}
.lock-dots i.on{background:#F2B441;border-color:#F2B441}
.lock-err{color:#F2857A;font-size:12.5px;height:18px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{height:62px;border-radius:12px;background:#333F4B;color:#E4EBF0;font-size:22px;
  border:1px solid #47545F;font-variant-numeric:tabular-nums}
.pad button:active{background:#44525F}
.pad button.wide{grid-column:span 1;font-size:15px}
.stdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--hair)}
.chip2{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:8px 12px;
  font-size:14px;min-height:38px}
.chip2.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  border-bottom:1px solid var(--hair)}
.kpi{background:var(--surface);padding:11px 13px}
.kpi i{display:block;font:normal 11px/1.2 inherit;color:var(--muted);margin-bottom:3px}
.kpi b{display:block;font:600 19px/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi b.good{color:#1B6E2B} .kpi b.bad{color:#9A3412}
.tsec{padding:13px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}
.trow{display:flex;gap:10px;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:10px 14px;align-items:baseline}
.trow span{flex:1;min-width:0;font-size:14px}
.trow em{font-style:normal;font-size:12px;color:var(--muted)}
.trow b{font:600 14px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.dates{display:flex;gap:9px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--hair)}
.dates input{flex:1;border:1px solid var(--hair);border-radius:8px;padding:9px 10px;background:#FBFCFC}
.fld{background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--hair);border-radius:8px;
  padding:9px 10px;background:#FBFCFC;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--signal);background:#fff;outline:none}
.fld textarea{min-height:64px;resize:vertical}
.grp{padding:14px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}

/* ---------- печатный документ ---------- */
.docview{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;display:none}
.docview.on{display:block}
.docbar{position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid var(--hair);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:9px;
  max-width:190mm;margin:0 auto}
.docpage{max-width:190mm;margin:0 auto;padding:14px 14px 60px;
  font:10pt/1.25 "Times New Roman",Times,serif;color:#000}
.docpage h1{font-size:12pt;text-align:center;margin:0 0 6px}
.docpage h2{font-size:10pt;margin:7px 0 3px}
.docpage p{margin:0 0 3px;text-align:justify}
.docpage .terms{column-count:2;column-gap:6mm;font-size:7.4pt;line-height:1.18;
  text-align:justify;margin:3px 0 5px}
.docpage .terms p{margin:0 0 2px}
.docpage .terms h2{font-size:8pt;margin:0 0 2px;break-after:avoid}
.docpage .terms ul{margin:1px 0 2px 13px}
.docpage .fill{border-bottom:1px solid #000;display:inline-block;min-width:60px;padding:0 3px}
.docpage table{width:100%;border-collapse:collapse;margin:4px 0;font-size:8.6pt}
.docpage th,.docpage td{border:1px solid #000;padding:2px 4px;vertical-align:top}
.docpage th{background:#EEE;font-weight:bold;text-align:center}
.docpage td.n,.docpage td.c{text-align:center}
.docpage td.r{text-align:right;white-space:nowrap}
.docpage .sig{display:flex;gap:18px;margin-top:16px}
.docpage .sig>div{flex:1}
.docpage .sigbox{border-bottom:1px solid #000;height:60px;margin:4px 0 2px;position:relative}
.docpage .sigpad{width:100%;height:60px;display:block;touch-action:none;cursor:crosshair}
.docpage .sigimg{max-height:112px;max-width:100%;display:block;
  margin:-14px 0 -22px 26px;position:relative;z-index:1}
.docpage .sigcap{font-size:8.6pt}
.docpage .sig{margin-top:8px;gap:14px}
.docpage .conf{font-size:8.2pt;line-height:1.22;text-align:justify;margin:5px 0 2px;
  padding:4px 6px;border:1px solid #000;background:#F4F4F4}
.docpage .sigclr{font-size:9pt;color:#0A6FB8;padding:2px 0;text-decoration:underline}
.docpage .sighint{font-size:9pt;color:#555;margin-top:2px}
.docpage .tot{margin:8px 0}
.docpage ul{margin:4px 0 6px 18px;padding:0}
.docpage li{margin-bottom:2px}
@media print{
  body{padding:0;background:#fff}
  .rig,.bar,.wrap,.sheet{display:none!important}
  .docbar,.sigclr,.sighint{display:none!important}
  .docview.on{position:static;display:block;overflow:visible}
  .docpage{max-width:none;padding:10mm;font-size:9.4pt;line-height:1.2}
  .docpage h1{font-size:11pt}
  .docpage h2{font-size:9.4pt;margin:5px 0 2px}
  .docpage .terms{font-size:6.6pt;line-height:1.14;column-gap:5mm}
  .docpage .terms h2{font-size:7.2pt}
  .docpage table{font-size:8.2pt;margin:3px 0}
  .docpage th,.docpage td{padding:1.5px 3px}
  .docpage .conf{font-size:7.2pt;line-height:1.16}
  .docpage .sigbox{height:52px}
  .docpage .sigimg{max-height:104px;margin:-12px 0 -20px 26px}
  /* нулевые поля страницы: так Safari не печатает адрес сайта и дату.
     Отступы вместо них заданы внутри .docpage */
  @page{size:A4;margin:0}
}

// ---------- файлы заказа ----------
// Тексты заказов остаются в обычном хранилище, а фото и документы —
// в IndexedDB: в обычном не хватит места даже на пару снимков.
let idb = null;
function openFiles(){
  return new Promise(res => {
    try{
      const rq = indexedDB.open('crm-files', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', {keyPath:'id'});
      };
      rq.onsuccess = () => { idb = rq.result; res(true); };
      rq.onerror   = () => { idb = null; res(false); };
    }catch(e){ idb = null; res(false); }
  });
}
function fileTx(mode){
  if (!idb) return null;
  try{ return idb.transaction('files', mode).objectStore('files'); }catch(e){ return null; }
}
function putFile(rec){
  return new Promise((res, rej) => {
    const st = fileTx('readwrite');
    if (!st) return rej(new Error('нет хранилища'));
    const rq = st.put(rec);
    rq.onsuccess = () => res(true);
    rq.onerror   = () => rej(rq.error || new Error('не записалось'));
  });
}
function getFile(id){
  return new Promise((res, rej) => {
    const st = fileTx('readonly');
    if (!st) return rej(new Error('нет хранилища'));
    const rq = st.get(id);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror   = () => rej(rq.error);
  });
}
function delFile(id){
  return new Promise(res => {
    const st = fileTx('readwrite');
    if (!st) return res(false);
    const rq = st.delete(id);
    rq.onsuccess = () => res(true);
    rq.onerror   = () => res(false);
  });
}

function logTo(rec, what){
  rec.history = rec.history || [];

}

// ---------- расчёт денег по заказу ----------
// Комиссия агрегатора берётся только с работ; детали в базу не входят.
// Скидка уменьшает работы пропорционально, поэтому процент считается
// от той суммы за работы, которую реально заплатил клиент.
function money(lines, disc, srcRate, extra){
  let works = 0, partsSale = 0, partsCost = 0;
  (lines||[]).forEach(l => {
    const sum = l.price*l.qty;
    if (l.p){ partsSale += sum; partsCost += (+l.cost||0)*l.qty; }
    else     { works += sum; }
  });
  const gross = works + partsSale;
  const k = 1 - (disc||0)/100;
  const worksNet = works * k;
  const net = gross * k;
  const comm = Math.round(worksNet * (srcRate||0) / 100);
  const ex = +extra || 0;
  const revenue = net + ex;                      // оборот
  const profit  = net + ex - comm - partsCost;   // чистыми
  return {works, partsSale, partsCost, gross, worksNet:Math.round(worksNet),
          net:Math.round(net), comm, extra:ex,
          revenue:Math.round(revenue), profit:Math.round(profit)};
}
function curMoney(){
  const sr = sources[acc.src] ? sources[acc.src].r : 0;
  return money(order, discount, sr, acc.extra);
}

    };
    box.appendChild(d);
  });
  const add = document.createElement('button');

                  '<div class="opt-s">Агрегатор, площадка или свой канал</div></div>';

                     'Изменение ставки не меняет уже сохранённые заказы: в них записан процент, действовавший на момент сохранения.';
  box.appendChild(note);
}

// Минимальный генератор .xlsx без библиотек: zip без сжатия (метод store).
// Нужен, потому что приложение обязано работать офлайн — подключить SheetJS нельзя.

const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const enc = s => new TextEncoder().encode(s);

function zipStore(files){        // files: [{name, data:Uint8Array}]
  const parts = [], central = [];
  let offset = 0;

  for (const f of files){
    const nameB = enc(f.name), crc = crc32(f.data), len = f.data.length;
    const lf = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lf.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);      // version
    dv.setUint16(6, 0x0800, true);  // UTF-8 имена
    dv.setUint16(8, 0, true);       // store
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);  // время/дата — фиктивные
    dv.setUint32(14, crc, true);
    dv.setUint32(18, len, true);
    dv.setUint32(22, len, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    lf.set(nameB, 30);
    parts.push(lf, f.data);

    const cd = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, len, true);
    cv.setUint32(24, len, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameB, 46);
    central.push(cd);

    offset += lf.length + len;
  }

  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  const all = [...parts, ...central, end];
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const b of all){ out.set(b, p); p += b.length; }
  return out;
}

const xesc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName = i => {
  let s = '';
  i++;
  while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; }
  return s;
};

// rows: массив массивов. Значение — число, строка, или {v, b:true} для жирного
function sheetXml(rows, widths){
  let cols = '';
  if (widths && widths.length){
    cols = '<cols>' + widths.map((w, i) =>
      `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  const body = rows.map((r, ri) => {
    const cells = r.map((c, ci) => {
      const ref = colName(ci) + (ri + 1);
      if (c === null || c === undefined || c === '') return '';
      const bold = (typeof c === 'object' && c.b);
      const val = (typeof c === 'object') ? c.v : c;
      const style = bold ? ' s="1"' : (typeof val === 'number' ? ' s="2"' : '');
      if (typeof val === 'number')
        return `<c r="${ref}"${style}><v>${val}</v></c>`;
      return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`;
}

function buildXlsx(sheets){       // sheets: [{name, rows, widths}]
  const files = [];
  const n = sheets.length;

  files.push({name:'[Content_Types].xml', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)});

  files.push({name:'_rels/.rels', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});

  files.push({name:'xl/workbook.xml', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});

  files.push({name:'xl/_rels/workbook.xml.rels', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)});

  files.push({name:'xl/styles.xml', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="3">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`)});

  sheets.forEach((s, i) => {
    files.push({name:`xl/worksheets/sheet${i+1}.xml`, data: enc(sheetXml(s.rows, s.widths))});
  });

  return zipStore(files);
}

function exportXlsx(a){
  const H = v => ({v, b:true});
  const per = PERIODS.find(p => p[0]===period);
  const head = [
    ['Отчёт по заказам'],
    ['Период', per ? per[1] : '', a.from.toLocaleDateString('ru-RU') + ' — ' +
      new Date(a.to.getTime()-86400000).toLocaleDateString('ru-RU')],
    ['Сформирован', new Date().toLocaleString('ru-RU')],
    [],
  ];

  const orders = [
    ...head,
    [H('Дата'),H('Клиент'),H('Телефон'),H('Техника'),H('Источник'),H('Ставка, %'),
     H('Тип'),H('Работы'),H('Детали, продажа'),H('Скидка, %'),H('Доп. доход'),
     H('Оборот'),H('Комиссия'),H('Себест. деталей'),H('Чистыми')],
  ];
  a.rows.forEach(r => {
    const m = recMoney(r);
    orders.push([
      r.date, r.client||'', r.phone||'', r.device||'',
      (r.src&&r.src.n)||'—', (r.src&&r.src.r)||0,
      (r.types||[]).join(', '),
      m.works, m.partsSale, r.discount||0, m.extra,
      m.revenue, m.comm, m.partsCost, m.profit,
    ]);
  });
  orders.push([]);
  orders.push([H('ИТОГО'),'','','','','','',
    a.agg.works, a.agg.partsSale, '', a.agg.extra,
    a.agg.revenue, a.agg.comm, a.agg.partsCost, a.agg.profit]);

  const totals = [
    ...head,
    [H('Показатель'), H('Значение')],
    ['Заказов', a.rows.length],
    ['Оборот', a.agg.revenue],
    ['Средний чек', a.avg],
    ['Работы', a.agg.works],
    ['Детали (продажа)', a.agg.partsSale],
    ['Себестоимость деталей', a.agg.partsCost],
    ['Комиссия агрегаторов', a.agg.comm],
    ['Доход мимо агрегаторов', a.agg.extra],
    ['Чистый доход', a.agg.profit],
  ];

  const bySrc = [...head, [H('Источник'),H('Заказов'),H('Оборот'),H('Комиссия'),H('Чистыми')]];
  Object.entries(a.bySrc).sort((x,y)=>y[1].revenue-x[1].revenue)
    .forEach(([n,v]) => bySrc.push([n, v.n, v.revenue, v.comm, v.profit]));

  const byType = [...head, [H('Тип'),H('Заказов'),H('Оборот')]];
  Object.entries(a.byType).sort((x,y)=>y[1].revenue-x[1].revenue)
    .forEach(([n,v]) => byType.push([n, v.n, v.revenue]));

  const data = buildXlsx([
    {name:'Заказы',       rows:orders, widths:[11,20,15,18,16,9,14,10,13,9,11,11,11,13,11]},
    {name:'Итоги',        rows:totals, widths:[26,14]},
    {name:'По источникам',rows:bySrc,  widths:[22,10,12,12,12]},
    {name:'По типам',     rows:byType, widths:[18,10,12]},
  ]);

  const name = 'Отчёт_' + new Date().toISOString().slice(0,10) + '.xlsx';
  const blob = new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = (typeof File !== 'undefined') ? new File([blob], name, {type:blob.type}) : null;

  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement('a');
  a2.href = url; a2.download = name;
  document.body.appendChild(a2); a2.click();
  setTimeout(() => { URL.revokeObjectURL(url); a2.remove(); }, 1500);
}

        await putFile({id, blob: f, name: f.name, type: f.type});
        r.files = r.files || [];
        r.files.unshift({id, name: f.name, type: f.type, size: f.size, at: new Date().toISOString()});
      }catch(err){
        alert('Не удалось сохранить «' + f.name + '». Возможно, в телефоне кончилось место.');

      if (!confirm('Удалить «' + f.name + '»?')) return;

  (r.history || []).forEach(h => {

    d.innerHTML = '<span></span>';

    sp.textContent = h.t;
    const em = document.createElement('em');

    em.textContent = new Date(h.at).toLocaleString('ru-RU');
    sp.appendChild(em);
    box.appendChild(d);
  });

  act.style.padding = '16px 14px 30px';
  act.innerHTML = '<button class="btn btn-main" id="bLoad" style="width:100%">Позиции и расчёт</button>'+
    '<button class="btn btn-ghost" id="bDel" style="width:100%;margin-top:9px">Удалить заказ</button>';

    $('#card').classList.remove('on');

  act.querySelector('#bDel').onclick = async () => {
    if (!confirm('Удалить заказ «' + (r.client||'без имени') + '» вместе с файлами?')) return;
    for (const f of (r.files||[])) { await delFile(f.id); }
    delOrder(r.id);
    if (curId === r.id){ order=[]; discount=0; dsel.value=0; curId=null; resetAcc(); estimate=null; }
    $('#card').classList.remove('on');
    buildBoard();
  };
}


// ---------- аналитика ----------
let period = 'month';
window.__period = 'month';
let dFrom = '', dTo = '';

function periodRange(p){
  const period = p || window.__period || 'month';
  const now = new Date();
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (period === 'today') return [d0, new Date(d0.getTime()+86400000)];
  if (period === 'week'){
    const wd = (d0.getDay()+6)%7;                  // понедельник — начало недели
    const from = new Date(d0.getTime() - wd*86400000);
    return [from, new Date(d0.getTime()+86400000)];
  }
  if (period === 'month') return [new Date(now.getFullYear(), now.getMonth(), 1),
                                  new Date(d0.getTime()+86400000)];
  if (period === 'year')  return [new Date(now.getFullYear(), 0, 1),
                                  new Date(d0.getTime()+86400000)];
  const f = dFrom ? new Date(dFrom+'T00:00:00') : new Date(2000,0,1);
  const t = dTo   ? new Date(dTo  +'T00:00:00') : d0;
  return [f, new Date(t.getTime()+86400000)];
}

function recMoney(r){
  // у старых записей учётных полей нет — считаем их прямыми заказами
  if (r.m) return r.m;
  return money(r.lines, r.discount, (r.src&&r.src.r)||0, r.extra||0);
}

function analData(p){
  if (!store) return null;
  const [from, to] = periodRange(p);
  const rows = store.filter(r => {
    const d = new Date(r.saved);
    return d >= from && d < to;
  }).sort((a,b) => new Date(b.saved) - new Date(a.saved));

  const agg = {revenue:0, profit:0, comm:0, partsCost:0, extra:0, works:0, partsSale:0};
  const bySrc = {}, byType = {};
  rows.forEach(r => {
    const m = recMoney(r);
    ['revenue','profit','comm','partsCost','extra','works','partsSale'].forEach(k => agg[k] += (m[k]||0));
    const sn = (r.src && r.src.n) || 'Не указан';
    bySrc[sn] = bySrc[sn] || {n:0, revenue:0, profit:0, comm:0};
    bySrc[sn].n++; bySrc[sn].revenue += m.revenue; bySrc[sn].profit += m.profit; bySrc[sn].comm += m.comm;
    const ts = (r.types && r.types.length) ? r.types : ['Без типа'];
    ts.forEach(t => {
      byType[t] = byType[t] || {n:0, revenue:0};
      byType[t].n++; byType[t].revenue += m.revenue;
    });
  });
  const avg = rows.length ? Math.round(agg.revenue/rows.length) : 0;
  return {rows, agg, bySrc, byType, avg, from, to};
}

function initPads(){
  const usePointer = !!window.PointerEvent;
  document.querySelectorAll('#docBody .sigpad').forEach(cv => {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 260, h = 72;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.lineWidth = 1.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#000';
    let on = false;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return [p.clientX-r.left, p.clientY-r.top];
    };
    const start = e => { e.preventDefault(); on=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
    const move  = e => { if(!on) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
    const end   = () => { on=false; };
    if (usePointer){
      cv.addEventListener('pointerdown',start);
      cv.addEventListener('pointermove',move);
      cv.addEventListener('pointerup',end);
      cv.addEventListener('pointercancel',end);
      cv.addEventListener('pointerleave',end);
    } else {
      cv.addEventListener('touchstart',start,{passive:false});
      cv.addEventListener('touchmove',move,{passive:false});
      cv.addEventListener('touchend',end);
      cv.addEventListener('mousedown',start);
      cv.addEventListener('mousemove',move);
      cv.addEventListener('mouseup',end);
    }
  });
  document.querySelectorAll('#docBody .sigclr').forEach(b => {
    b.onclick = () => {
      const cv = document.querySelector('#docBody .sigpad[data-pad="'+b.dataset.clr+'"]');
      if (cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    };
  });
}

function buildPad(){
  const pad = $('#pad');
  pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','C','0','←'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    if (k === 'C' || k === '←') b.className = 'wide';
    b.onclick = () => {
      if (k === 'C'){ pinBuf = ''; }
      else if (k === '←'){ pinBuf = pinBuf.slice(0,-1); }
      else if (pinBuf.length < 4){ pinBuf += k; }
      drawDots();
      $('#lockErr').textContent = '';
      if (pinBuf.length === 4) setTimeout(tryPin, 120);
    };
    pad.appendChild(b);
  });

}
function tryPin(){
  if (pinBuf === curPin()){
    pinBuf = '';
    $('#lock').classList.add('off');
    drawDots();
  } else {
    pinBuf = '';
    drawDots();
    $('#lockErr').textContent = 'Неверный код';
  }
}
function lockNow(){

}

}


// ---------- резервная копия ----------
function exportBackup(){
  if (!store){ alert('Архив недоступен.'); return; }
  const data = JSON.stringify({v:1, at:new Date().toISOString(), orders:store, sources}, null, 1);
  const blob = new Blob([data], {type:'application/json'});
  const name = 'Резервная_копия_' + new Date().toISOString().slice(0,10) + '.json';
  const f = (typeof File !== 'undefined') ? new File([blob], name, {type:blob.type}) : null;
  if (f && navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f], title:name}).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d.orders) throw new Error('не тот файл');
        if (!confirm('В копии заказов: ' + d.orders.length + '. Заменить текущий архив?')) return;
        store = d.orders;
        if (d.sources) { sources = d.sources; saveSources(); }
        saveStore();
        alert('Копия загружена. Фото и документы в копию не входят.');
        render();
      }catch(e){ alert('Файл не похож на резервную копию.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

// ---------- хранилище заказов ----------
const DBKEY = 'orders.v1';
let store = null;
function loadStore(){
  try{ const raw = localStorage.getItem(DBKEY); store = raw ? JSON.parse(raw) : []; }
  catch(e){ store = null; }
}
function saveStore(){
  if (!store) return false;
  try{ localStorage.setItem(DBKEY, JSON.stringify(store.slice(0,300))); return true; }
  catch(e){ return false; }
}
loadStore();

function snapshot(){
  const t = totals();
  const src = sources[acc.src] || {n:'—', r:0};
  const m = money(order, discount, src.r, acc.extra);
  return {
    id: curId || Date.now(),
    saved: new Date().toISOString(),
    date: today(),
    client: C.client || '', phone: C.phone || '',
    device: C.device || '', docNo: C.docNo || '',
    total: t.net, gross: t.gross, discount,
    src: {n: src.n, r: src.r}, types: acc.types.slice(), extra: acc.extra || 0, m,
    lines: JSON.parse(JSON.stringify(order)),
    fields: JSON.parse(JSON.stringify(C)),
  };
}
function mergeInto(rec, log){
  const old = store && store.find(r => r.id === rec.id);
  rec.status   = (old && old.status)   || 'agree';
  rec.created  = (old && old.created)  || rec.saved;
  rec.comments = (old && old.comments) || [];
  rec.files    = (old && old.files)    || [];
  rec.history  = (old && old.history)  || [];
  if (log === false) return rec;
  if (!old) logTo(rec, 'Заказ создан');
  else if (old.total !== rec.total) logTo(rec, 'Сумма изменена: ' + fmt(old.total) + ' → ' + fmt(rec.total) + ' ₽');
  else logTo(rec, 'Заказ сохранён');
  return rec;
}
function saveOrder(silent){
  if (!store){ if(!silent) alert('Телефон не разрешил хранить данные.'); return; }
  const rec = mergeInto(snapshot());
  curId = rec.id;
  const i = store.findIndex(r => r.id === rec.id);
  if (i >= 0) store[i] = rec; else store.unshift(rec);
  const ok = saveStore();
  if (!silent) alert(ok ? 'Сохранено.' : 'Не удалось сохранить.');
}
function openOrder(rec){
  order = JSON.parse(JSON.stringify(rec.lines || []));
  discount = rec.discount || 0;
  Object.keys(C).forEach(k => delete C[k]);
  Object.assign(C, rec.fields || {});
  acc.extra = rec.extra || 0;
  acc.types = (rec.types || []).slice();
  const si = sources.findIndex(x => x.n === (rec.src && rec.src.n));
  acc.src = si >= 0 ? si : 0;
  curId = rec.id;
}
function delOrder(id){
  if (!store) return;
  store = store.filter(r => r.id !== id);
  saveStore();
  if (curId === id) curId = null;
}

const HANDOFF = 'handoff.v1';
function takeHandoff(){
  let h = null;
  try{ const raw = localStorage.getItem(HANDOFF); if (raw) h = JSON.parse(raw); }catch(e){}
  if (!h) return false;
  try{ localStorage.removeItem(HANDOFF); }catch(e){}
  if (!store) return false;

  if (h.target){
    const r = store.find(x => x.id === h.target);
    if (r){
      openOrder(r);
      order = order.concat(h.lines);
      if (h.discount) discount = h.discount;
      const rec = mergeInto(snapshot());
      logTo(rec, 'Добавлено позиций из калькулятора: ' + h.lines.length);
      const i = store.findIndex(x => x.id === rec.id);
      store[i] = rec;
      saveStore();
      openCard(rec.id);
      return true;
    }
  }
  order = h.lines.slice();
  discount = h.discount || 0;
  Object.keys(C).forEach(k => delete C[k]);
  C.docDate = today(); C.term = '14';
  resetAcc();
  estimate = null;
  curId = Date.now();
  const rec = mergeInto(snapshot());
  store.unshift(rec);
  saveStore();
  cardId = rec.id;
  openWiz(rec.id);        // новый заказ ведём по шагам
  return true;
}

let boardFilter = '';

function daysSince(iso){
  const d = new Date(iso);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function monthKey(iso){
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function curMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthTitle(k){
  const [y,m] = k.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
}
function plural(n, a, b, c){
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
  return c;
}

  box.innerHTML = '';
  if (!store){
    box.innerHTML = '<div class="none">Телефон не разрешил хранить данные — доска недоступна.</div>';
    return;
  }

  const q = $('#fq').value.trim().toLowerCase();
  let list = store.filter(r => monthKey(r.created || r.saved) === mk);
  if (q) list = list.filter(r => ((r.client||'')+' '+(r.device||'')+' '+(r.docNo||'')).toLowerCase().includes(q));
  if (boardFilter) list = list.filter(r => (r.status||'agree') === boardFilter);

  // закрытые всегда внизу, остальные — свежие сверху
  list = list.slice().sort((x,y) => {
    const cx = x.status==='closed' ? 1 : 0, cy = y.status==='closed' ? 1 : 0;
    if (cx !== cy) return cx - cy;
    return new Date(y.created||y.saved) - new Date(x.created||x.saved);
  });

  if (!list.length){
    box.innerHTML = '<div class="none">' +
      (q || boardFilter ? 'Ничего не нашлось.' : 'В этом месяце заказов пока нет.') + '</div>';
    return;
  }

  list.forEach(r => {
    const st = stOf(r.status || 'agree');
    const d = daysSince(r.created || r.saved);
    const dead = DEAD.includes(r.status);
    const old = !dead && d >= OLD_DAYS;

    const b = document.createElement('button');
    b.className = 'brow' + (r.status==='closed' ? ' closed' : '') + (old ? ' old' : '');
    b.style.background = old ? '' : st.bg;
    b.style.borderLeftColor = old ? '' : st.c;
    b.innerHTML =
      '<div class="brow-main">'+
        '<div class="brow-t"></div>'+
        '<div class="brow-s"></div>'+
      '</div>'+
      '<div class="brow-r">'+
        '<div class="brow-sum">'+fmt(r.total||0)+' ₽</div>'+
        '<div class="brow-age">'+(d===0 ? 'сегодня' : d + ' ' + plural(d,'день','дня','дней'))+'</div>'+
      '</div>';
    b.querySelector('.brow-t').textContent = r.client || 'Без имени';
    b.querySelector('.brow-s').textContent =
      st.t + '  ·  ' + (r.device || 'техника не указана') +
      ((r.files && r.files.length) ? '  ·  ' + r.files.length + ' файл.' : '') +
      ((r.comments && r.comments.length) ? '  ·  ' + r.comments.length + ' комм.' : '');
    b.onclick = () => openCard(r.id);
    box.appendChild(b);
  });
}

function buildMonths(){
  const box = $('#monthsBody');
  box.innerHTML = '';
  if (!store){ box.innerHTML = '<div class="none">База недоступна.</div>'; return; }
  const keys = {};
  store.forEach(r => {
    const k = monthKey(r.created || r.saved);
    keys[k] = keys[k] || {n:0, sum:0};
    keys[k].n++; keys[k].sum += (r.total||0);
  });
  const cur = curMonthKey();
  Object.keys(keys).sort().reverse().forEach(k => {
    const b = document.createElement('button');
    b.className = 'opt' + (k === (boardMonth||cur) ? ' act' : '');
    b.innerHTML = '<div class="opt-main"><div class="opt-t"></div><div class="opt-s"></div></div>'+
                  '<div class="opt-p">'+fmt(keys[k].sum)+' ₽</div>';
    b.querySelector('.opt-t').textContent = monthTitle(k) + (k===cur ? '  ·  текущий' : '');
    b.querySelector('.opt-s').textContent = keys[k].n + ' ' + plural(keys[k].n,'заказ','заказа','заказов');
    b.onclick = () => {
      boardMonth = (k === cur) ? null : k;
      $('#months').classList.remove('on');
      buildBoard();
    };
    box.appendChild(b);
  });
}

// ---------- связывание ----------
$('#bMenuF').onclick = () => { buildMenu(); $('#menu').classList.add('on'); };
$('#bMenuClose').onclick = () => $('#menu').classList.remove('on');
$('#bCardClose').onclick = () => { $('#card').classList.remove('on'); buildBoard(); };
$('#bAcctClose').onclick = () => $('#acct').classList.remove('on');
$('#bSrcClose').onclick = () => $('#srcs').classList.remove('on');
$('#bAnalClose').onclick = () => $('#anal').classList.remove('on');
$('#bFormClose').onclick = () => { $('#form').classList.remove('on'); $('#outs').classList.add('on'); };
$('#bOutClose').onclick = () => $('#outs').classList.remove('on');
$('#bDocClose').onclick = () => $('#docview').classList.remove('on');
$('#bMonthsClose').onclick = () => $('#months').classList.remove('on');
$('#bMonths').onclick = () => { buildMonths(); $('#months').classList.add('on'); };
$('#bCalc').onclick = () => { location.href = 'index.html'; };
$('#fq').oninput = buildBoard;
$('#fkpi').onclick = () => { buildAnal(); $('#anal').classList.add('on'); };

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

buildPad();
openFiles();
buildBoard();
if (location.hash === '#handoff'){
  history.replaceState(null,'','base.html');
  setTimeout(() => { if (takeHandoff()) buildBoard(); }, 60);
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
