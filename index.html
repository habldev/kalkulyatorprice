<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прайс">
<meta name="theme-color" content="#26303A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>Калькулятор услуг</title>
<style>
:root{
  --slab:#26303A; --slab-2:#1B242C;
  --lcd:#C9D4C5; --lcd-ink:#161E15; --lcd-dim:#5A6858;
  --bg:#E9ECEE; --surface:#FFFFFF;
  --ink:#13202A; --muted:#5E6B75; --hair:#D3D9DD;
  --signal:#0A6FB8; --danger:#B3261E;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- корпус прибора ---------- */
.rig{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;
  background:
    linear-gradient(180deg,#323E49 0%,#26303A 42%,#1E2831 100%);
  box-shadow:0 3px 14px rgba(0,0,0,.35)}
.plate{position:relative;border-radius:12px;padding:12px 13px 13px;
  background:
    repeating-linear-gradient(97deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(165deg,#3A4653 0%,#2B3641 55%,#222C35 100%);
  border:1px solid #47545F;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 8px rgba(0,0,0,.30)}
/* винты по углам */
.plate::before,.plate::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#8A98A4,#4B5762 60%,#39434D);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);top:7px}
.plate::before{left:7px} .plate::after{right:7px}

.rig-top{display:flex;align-items:baseline;justify-content:space-between;margin:0 14px 9px}
.rig-brand{font-size:10.5px;letter-spacing:.16em;color:#93A3B0;text-transform:uppercase}
.rig-date{font-size:11px;color:#7E909D;font-variant-numeric:tabular-nums}

/* ---------- жидкокристаллическое табло ---------- */
.lcd{border-radius:6px;padding:3px;
  background:linear-gradient(180deg,#171E24,#232D35);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.lcd-face{position:relative;border-radius:4px;padding:8px 11px 9px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,#D3DCCD 0%,#C4CFC0 55%,#B6C2B2 100%)}
.lcd-face::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px)}
.lcd-label{font:11px/1 ui-monospace,Menlo,monospace;color:#5F6D5D;letter-spacing:.08em}
.lcd-digits{margin:5px 0 2px;min-height:52px;display:flex;align-items:flex-end}
.lcd-digits svg{width:100%;height:auto;max-height:64px;display:block}
.lcd-sub{display:flex;gap:10px;border-top:1px solid rgba(22,30,21,.22);padding-top:6px}
.sub{flex:1;min-width:0}
.sub i{display:block;font:normal 9.5px/1.2 ui-monospace,Menlo,monospace;color:#66755F}
.sub b{display:block;font:600 13px/1.25 ui-monospace,Menlo,monospace;color:#1B2419;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b.cut{color:#7A4A12}

/* ---------- поворотный регулятор ---------- */
.accbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.accbar .chip{border:1px solid #47545F;background:#222C35;color:#C7D5E0;border-radius:7px;
  padding:6px 9px;font-size:12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.accbar .chip b{color:#F2B441;font-variant-numeric:tabular-nums}
.accbar .chip.net b{color:#8FD694}
.knobrow{display:flex;align-items:center;gap:13px;margin-top:11px}
.knob{width:108px;height:108px;flex:none;touch-action:none;cursor:grab}
.knob:active{cursor:grabbing}
.knob svg{width:100%;height:100%;display:block}
.knob:focus-visible{outline:2px solid #7FB7E0;outline-offset:3px;border-radius:50%}
.knobinfo{min-width:0}
.knobcap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#93A3B0}
.knobval{font:600 26px/1.15 ui-monospace,Menlo,monospace;color:#F2B441;
  font-variant-numeric:tabular-nums;margin:1px 0 3px}
.knobhint{font-size:11px;color:#7E909D;line-height:1.3}

.empty{padding:52px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:17px}
.line{background:var(--surface);border-bottom:1px solid var(--hair);padding:11px 14px;display:flex;gap:11px}
.line-idx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  padding-top:3px;min-width:17px;font-variant-numeric:tabular-nums}
.line-main{flex:1;min-width:0}
.line-name{font-size:15px;line-height:1.3;margin-bottom:2px}
.line-cat{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.line-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:19px;color:var(--signal);line-height:1}
.stepper button:active{background:#EAF3FA}
.stepper span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);height:38px;line-height:38px}
.price-edit{border:1px solid var(--hair);border-radius:7px;padding:0 9px;height:38px;width:92px;
  text-align:right;font-variant-numeric:tabular-nums;background:#FBFCFC;-webkit-appearance:none}
.price-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.mult{color:var(--muted);font-size:14px}
.line-sum{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.line-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.wlab{font-size:11.5px;color:var(--muted)}
.wsel{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 6px;background:#FBFCFC}
.cost-edit{border:1px solid var(--hair);border-radius:7px;height:34px;width:78px;padding:0 8px;
  text-align:right;background:#FFF6E5;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.cost-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.wnow{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 9px;
  font-size:12.5px;color:var(--signal);background:#fff;font-variant-numeric:tabular-nums}
.mini:active{background:#EAF3FA}
.seg{flex:1;height:38px;border:1px solid var(--hair);border-radius:8px;background:#fff;font-size:14.5px}
.seg.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.line-del{align-self:flex-start;width:32px;height:32px;color:var(--muted);font-size:20px;line-height:1}
.line-del:active{color:var(--danger)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--hair);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.btn{min-height:var(--tap);border-radius:9px;padding:0 15px;font-size:15.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-main{background:var(--signal);color:#fff;flex:1}
.btn-main:active{background:#095C99}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);background:#fff}
.btn-ghost:active{background:#F1F4F6}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--hair);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.sheet-row{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.sheet-h{flex:1;font-size:16px;font-weight:600}
.search{flex:1;height:var(--tap);border:1px solid var(--hair);border-radius:9px;padding:0 12px;
  background:#F4F6F7;-webkit-appearance:none}
.search:focus{background:#fff;border-color:var(--signal);outline:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body-in{max-width:560px;margin:0 auto;padding-bottom:30px}
.crumb{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);font-size:13px;
  background:#DFE4E7;position:sticky;top:0}
.crumb button{color:var(--signal);font-size:14px;min-height:32px}
.opt{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:center;min-height:var(--tap)}
.opt:active{background:#EAF3FA}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:15px;line-height:1.3}
.opt-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt-p{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-cnt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.opt.hit{background:#DCEFD8}
.opt.act .opt-t{color:var(--signal)}
.none{padding:38px 22px;text-align:center;color:var(--muted)}

.lock{position:fixed;inset:0;z-index:90;background:var(--slab);display:flex;
  align-items:center;justify-content:center;padding:24px}
.lock.off{display:none}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-t{color:#C7D5E0;font-size:15px;margin-bottom:16px}
.lock-dots{display:flex;gap:13px;justify-content:center;margin-bottom:8px;height:15px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #7E909D;display:block}
.lock-dots i.on{background:#F2B441;border-color:#F2B441}
.lock-err{color:#F2857A;font-size:12.5px;height:18px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{height:62px;border-radius:12px;background:#333F4B;color:#E4EBF0;font-size:22px;
  border:1px solid #47545F;font-variant-numeric:tabular-nums}
.pad button:active{background:#44525F}
.pad button.wide{grid-column:span 1;font-size:15px}
.stdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--hair)}
.chip2{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:8px 12px;
  font-size:14px;min-height:38px}
.chip2.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  border-bottom:1px solid var(--hair)}
.kpi{background:var(--surface);padding:11px 13px}
.kpi i{display:block;font:normal 11px/1.2 inherit;color:var(--muted);margin-bottom:3px}
.kpi b{display:block;font:600 19px/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi b.good{color:#1B6E2B} .kpi b.bad{color:#9A3412}
.tsec{padding:13px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}
.trow{display:flex;gap:10px;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:10px 14px;align-items:baseline}
.trow span{flex:1;min-width:0;font-size:14px}
.trow em{font-style:normal;font-size:12px;color:var(--muted)}
.trow b{font:600 14px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.dates{display:flex;gap:9px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--hair)}
.dates input{flex:1;border:1px solid var(--hair);border-radius:8px;padding:9px 10px;background:#FBFCFC}
.fld{background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--hair);border-radius:8px;
  padding:9px 10px;background:#FBFCFC;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--signal);background:#fff;outline:none}
.fld textarea{min-height:64px;resize:vertical}
.grp{padding:14px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}

/* ---------- печатный документ ---------- */
.docview{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;display:none}
.docview.on{display:block}
.docbar{position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid var(--hair);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:9px;
  max-width:190mm;margin:0 auto}
.docpage{max-width:190mm;margin:0 auto;padding:14px 14px 60px;
  font:10pt/1.25 "Times New Roman",Times,serif;color:#000}
.docpage h1{font-size:12pt;text-align:center;margin:0 0 6px}
.docpage h2{font-size:10pt;margin:7px 0 3px}
.docpage p{margin:0 0 3px;text-align:justify}
.docpage .terms{column-count:2;column-gap:6mm;font-size:7.4pt;line-height:1.18;
  text-align:justify;margin:3px 0 5px}
.docpage .terms p{margin:0 0 2px}
.docpage .terms h2{font-size:8pt;margin:0 0 2px;break-after:avoid}
.docpage .terms ul{margin:1px 0 2px 13px}
.docpage .fill{border-bottom:1px solid #000;display:inline-block;min-width:60px;padding:0 3px}
.docpage table{width:100%;border-collapse:collapse;margin:4px 0;font-size:8.6pt}
.docpage th,.docpage td{border:1px solid #000;padding:2px 4px;vertical-align:top}
.docpage th{background:#EEE;font-weight:bold;text-align:center}
.docpage td.n,.docpage td.c{text-align:center}
.docpage td.r{text-align:right;white-space:nowrap}
.docpage .sig{display:flex;gap:18px;margin-top:16px}
.docpage .sig>div{flex:1}
.docpage .sigbox{border-bottom:1px solid #000;height:60px;margin:4px 0 2px;position:relative}
.docpage .sigpad{width:100%;height:60px;display:block;touch-action:none;cursor:crosshair}
.docpage .sigimg{max-height:112px;max-width:100%;display:block;
  margin:-14px 0 -22px 26px;position:relative;z-index:1}
.docpage .sigcap{font-size:8.6pt}
.docpage .sig{margin-top:8px;gap:14px}
.docpage .conf{font-size:8.2pt;line-height:1.22;text-align:justify;margin:5px 0 2px;
  padding:4px 6px;border:1px solid #000;background:#F4F4F4}
.docpage .sigclr{font-size:9pt;color:#0A6FB8;padding:2px 0;text-decoration:underline}
.docpage .sighint{font-size:9pt;color:#555;margin-top:2px}
.docpage .tot{margin:8px 0}
.docpage ul{margin:4px 0 6px 18px;padding:0}
.docpage li{margin-bottom:2px}
@media print{
  body{padding:0;background:#fff}
  .rig,.bar,.wrap,.sheet{display:none!important}
  .docbar,.sigclr,.sighint{display:none!important}
  .docview.on{position:static;display:block;overflow:visible}
  .docpage{max-width:none;padding:10mm;font-size:9.4pt;line-height:1.2}
  .docpage h1{font-size:11pt}
  .docpage h2{font-size:9.4pt;margin:5px 0 2px}
  .docpage .terms{font-size:6.6pt;line-height:1.14;column-gap:5mm}
  .docpage .terms h2{font-size:7.2pt}
  .docpage table{font-size:8.2pt;margin:3px 0}
  .docpage th,.docpage td{padding:1.5px 3px}
  .docpage .conf{font-size:7.2pt;line-height:1.16}
  .docpage .sigbox{height:52px}
  .docpage .sigimg{max-height:104px;margin:-12px 0 -20px 26px}
  /* нулевые поля страницы: так Safari не печатает адрес сайта и дату.
     Отступы вместо них заданы внутри .docpage */
  @page{size:A4;margin:0}
}
body.printing #docBody{width:718px;max-width:none}   /* 190 мм при 96 dpi */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="rig">
    <div class="plate">
      <div class="rig-top">
        <span class="rig-brand">Савинов · сервис</span>
        <span class="rig-date" id="date"></span>
      </div>

      <div class="lcd">
        <div class="lcd-face">
          <div class="lcd-label">Итого к оплате</div>
          <div class="lcd-digits" id="total"></div>
          <div class="lcd-sub">
            <div class="sub"><i>Позиций</i><b id="mCount">0</b></div>
            <div class="sub"><i>Без скидки</i><b id="mGross">0 ₽</b></div>
            <div class="sub"><i>Скидка</i><b id="mCut" class="cut">0 ₽</b></div>
          </div>
        </div>
      </div>

      <div class="accbar" id="accBar"></div>

      <div class="knobrow">
        <div class="knob" id="knob" role="slider" tabindex="0" aria-label="Размер скидки"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="без скидки"></div>
        <div class="knobinfo">
          <div class="knobcap">Скидка</div>
          <div class="knobval" id="knobVal">выкл</div>
          <div class="knobhint">Крутите ручку или нажмите на деление</div>
        </div>
      </div>
      <select id="disc" class="sr"></select>
    </div>
  </header>
  <main id="order"></main>
</div>

<div class="bar"><div class="bar-in">
  <button class="btn btn-ghost" id="bMenu" aria-label="Меню">☰</button>
  <button class="btn btn-main" id="bAdd">Добавить услугу</button>
  <button class="btn btn-ghost" id="bOut">Оформить</button>
</div></div>

<!-- выбор услуги -->
<div class="sheet" id="sheet">
  <div class="sheet-top">
    <div class="sheet-row">
      <input class="search" id="q" type="search" placeholder="Поиск по названию" autocomplete="off">
      <button class="btn btn-ghost" id="bDone">Готово</button>
    </div>
    <div class="sheet-row" style="margin-top:8px;gap:7px">
      <button class="seg on" id="tabSvc">Услуги</button>
      <button class="seg" id="tabPart">Детали</button>
    </div>
  </div>
  <div class="sheet-body"><div class="sheet-body-in" id="list"></div></div>
</div>

<!-- оформить -->
<div class="sheet" id="outs">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Оформить</span>
    <button class="btn btn-ghost" id="bOutClose">Закрыть</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="outList"></div></div>
</div>

<!-- данные клиента -->
<div class="sheet" id="form">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Данные клиента</span>
    <button class="btn btn-ghost" id="bFormClose">Готово</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="formBody"></div></div>
</div>

<!-- вход -->
<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-t">Введите код</div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="lock-err" id="lockErr"></div>
    <div class="pad" id="pad"></div>
  </div>
</div>

<!-- карточка заказа -->
<div class="sheet" id="card">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Заказ</span>
    <button class="btn btn-ghost" id="bCardClose">Закрыть</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="cardBody"></div></div>
</div>

<!-- меню -->
<div class="sheet" id="menu">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Меню</span>
    <button class="btn btn-ghost" id="bMenuClose">Закрыть</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="menuBody"></div></div>
</div>

// ---------- семисегментное табло ----------
// Рисуем сегменты вручную: шрифт качать нельзя, приложение обязано жить офлайн.
const SEG_MAP = {
  '0':'abcdef', '1':'bc', '2':'abged', '3':'abgcd', '4':'fgbc',
  '5':'afgcd', '6':'afgedc', '7':'abc', '8':'abcdefg', '9':'abfgcd'
};
const D_W = 100, D_H = 180, SEG_T = 17;

function hSeg(y, x1, x2){
  const t = SEG_T/2;
  return `${x1},${y} ${x1+t},${y-t} ${x2-t},${y-t} ${x2},${y} ${x2-t},${y+t} ${x1+t},${y+t}`;
}
function vSeg(x, y1, y2){
  const t = SEG_T/2;
  return `${x},${y1} ${x+t},${y1+t} ${x+t},${y2-t} ${x},${y2} ${x-t},${y2-t} ${x-t},${y1+t}`;
}
const SEG_PTS = {
  a: hSeg(11, 13, 87), g: hSeg(90, 13, 87), d: hSeg(169, 13, 87),
  f: vSeg(13, 11, 90),  b: vSeg(87, 11, 90),
  e: vSeg(13, 90, 169),  c: vSeg(87, 90, 169),
};

function segDigit(ch, x){
  const on = SEG_MAP[ch] || '';
  let out = `<g transform="translate(${x},0)">`;
  for (const k of 'abcdefg'){
    const lit = on.includes(k);
    out += `<polygon points="${SEG_PTS[k]}" fill="${lit ? '#151D14' : '#151D14'}" `+
           `opacity="${lit ? 0.93 : 0.07}"/>`;
  }
  return out + '</g>';
}

// Табло показывает число с разрядами и знаком рубля
function segRender(num){
  const txt = fmt(num);                 // «21 915»
  let x = 0, body = '';
  for (const ch of txt){
    if (ch === ' '){ x += 42; continue; }
    body += segDigit(ch, x);
    x += D_W + 16;
  }
  // знак рубля рисуем контуром — сегментами он не собирается
  const rw = 96;
  const rub = `<g transform="translate(${x+6},0)" opacity="0.88">
    <path d="M18 18 L18 150 M18 18 L56 18 A34 34 0 0 1 56 86 L18 86 M4 112 L64 112"
      fill="none" stroke="#151D14" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>`;
  const W = x + rw;
  return `<svg viewBox="0 0 ${W} ${D_H}" xmlns="http://www.w3.org/2000/svg" `+
         `preserveAspectRatio="xMaxYMax meet" aria-hidden="true">${body}${rub}</svg>`;
}

// ---------- поворотный регулятор скидки ----------
const K_MIN = -135, K_MAX = 135, K_STEPS = 20;     // 0..100 с шагом 5
const angOf = v => K_MIN + (v/100) * (K_MAX - K_MIN);

function buildKnob(){
  let ticks = '';
  for (let i = 0; i <= K_STEPS; i++){
    const v = i*5, a = angOf(v), big = (v % 25 === 0);
    ticks += `<g transform="rotate(${a} 70 70)">`+
      `<rect x="69.1" y="${big?10:12}" width="1.8" height="${big?10:6}" rx="0.9" `+
      `fill="${big?'#C7D5E0':'#7A8794'}" data-tick="${v}"/></g>`;
    if (big){
      const rad = (a-90) * Math.PI/180, r = 66;
      ticks += `<text x="${70+r*Math.cos(rad)}" y="${70+r*Math.sin(rad)+3.4}" `+
               `text-anchor="middle" font-size="9" fill="#93A3B0" `+
               `font-family="ui-monospace,Menlo,monospace">${v}</text>`;
    }
  }
  return `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="kb" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#5A6774"/><stop offset="62%" stop-color="#3A4551"/>
        <stop offset="100%" stop-color="#232C35"/>
      </radialGradient>
      <linearGradient id="kr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6E7C89"/><stop offset="100%" stop-color="#2B343D"/>
      </linearGradient>
    </defs>
    ${ticks}
    <circle cx="70" cy="70" r="47" fill="url(#kr)"/>
    <circle cx="70" cy="70" r="43" fill="url(#kb)" stroke="#1C242B" stroke-width="1"/>
    <g id="kPtr" transform="rotate(-135 70 70)">
      <rect x="67.6" y="31" width="4.8" height="26" rx="2.4" fill="#F2B441"/>
      <circle cx="70" cy="70" r="7" fill="#20282F" stroke="#4A5561" stroke-width="1"/>
    </g>
  </svg>`;
}

function setDiscount(v){
  v = Math.max(0, Math.min(100, Math.round(v/5)*5));
  discount = v;
  dsel.value = v;
  render();
}

function paintKnob(){
  const p = document.getElementById('kPtr');
  if (p) p.setAttribute('transform', `rotate(${angOf(discount)} 70 70)`);
  const k = $('#knob');
  k.setAttribute('aria-valuenow', discount);
  k.setAttribute('aria-valuetext', discount ? discount+'%' : 'без скидки');
  $('#knobVal').textContent = discount ? discount+'%' : 'выкл';
}

function initKnob(){
  const k = $('#knob');
  k.innerHTML = buildKnob();
  let drag = false;
  const fromEvent = e => {
    const r = k.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const dx = p.clientX - (r.left + r.width/2);
    const dy = p.clientY - (r.top + r.height/2);
    let a = Math.atan2(dx, -dy) * 180/Math.PI;      // 0° — вверх
    a = Math.max(K_MIN, Math.min(K_MAX, a));
    setDiscount((a - K_MIN) / (K_MAX - K_MIN) * 100);
  };
  const down = e => { drag = true; e.preventDefault(); fromEvent(e); };
  const move = e => { if (drag){ e.preventDefault(); fromEvent(e); } };
  const up   = () => { drag = false; };
  if (window.PointerEvent){
    k.addEventListener('pointerdown', down);
    k.addEventListener('pointermove', move);
    k.addEventListener('pointerup', up);
    k.addEventListener('pointercancel', up);
  } else {
    k.addEventListener('touchstart', down, {passive:false});
    k.addEventListener('touchmove', move, {passive:false});
    k.addEventListener('touchend', up);
    k.addEventListener('mousedown', down);
    k.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }
  k.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ setDiscount(discount+5); e.preventDefault(); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown'){ setDiscount(discount-5); e.preventDefault(); }
    if (e.key === 'Home'){ setDiscount(0); e.preventDefault(); }
    if (e.key === 'End'){ setDiscount(100); e.preventDefault(); }
  });
}

// гарантия от суммы строки
function autoW(sum){ if (!sum) return 0; return sum<=5000 ? 30 : (sum<=10000 ? 60 : 90); }
function warranty(l){
  const sum = l.price*l.qty;
  return (l.w===null || l.w===undefined || l.w==='') ? autoW(sum) : +l.w;
}
const W_OPTS = [['','авто'],['0','без гар.'],['14','14 дн'],['30','30 дн'],
                ['60','60 дн'],['90','90 дн'],['180','180 дн'],['365','365 дн']];

const nameOf = l => (l.c || l.p) ? l.t : svcs[l.i].t;
const catOf  = l => l.p ? ('Деталь · ' + (l.pc >= 0 ? pcats[l.pc] : 'своя'))
                       : (l.c ? 'Своя работа' : short[svcs[l.i].c]);

function priceText(s){
  if (s.k==='z') return 'бесплатно';
  if (s.k==='d') return 'договорная';
  if (s.k==='o') return 'от '+fmt(s.p)+' ₽';
  if (s.x) return fmt(s.p)+'–'+fmt(s.x)+' ₽';
  return fmt(s.p)+' ₽';
}
function hint(l){
  if (l.p) return l.price ? '' : 'Впишите цену детали';
  if (l.c) return '';
  const s = svcs[l.i];
  if (s.k==='d') return 'Цена договорная — впишите свою';
  if (s.k==='o') return 'Цена «от» — можно увеличить';
  if (s.x) return 'Вилка '+fmt(s.p)+'–'+fmt(s.x)+' ₽';
  return '';
}

function rangeBtns(l){
  if (l.c || l.p) return '';
  const s = svcs[l.i];
  if (!s.x || s.k==='o') return '';
  return '<button class="mini" data-set="'+s.p+'">мин '+fmt(s.p)+'</button>'+
         '<button class="mini" data-set="'+s.x+'">макс '+fmt(s.x)+'</button>';
}

function totals(){
  const gross = order.reduce((a,l)=>a+l.price*l.qty,0);
  const cut = Math.round(gross*discount/100);
  return {gross, cut, net: gross-cut};
}

function render(){
  const t = totals();
  $('#total').innerHTML = segRender(t.net);
  paintKnob();
  const mm = curMoney();
  const srcName = (sources[acc.src]||{n:'—'}).n;
  const srcRate = (sources[acc.src]||{r:0}).r;
  $('#accBar').innerHTML =
    '<span class="chip">Источник: <b></b></span>'+
    (mm.comm ? '<span class="chip">Комиссия '+srcRate+'%: <b>−'+fmt(mm.comm)+' ₽</b></span>' : '')+
    (mm.partsCost ? '<span class="chip">Детали: <b>−'+fmt(mm.partsCost)+' ₽</b></span>' : '')+
    (mm.extra ? '<span class="chip">Доп.: <b>+'+fmt(mm.extra)+' ₽</b></span>' : '')+
    (estimate ? '<span class="chip">Смета от '+estimate.at+': <b>'+fmt(estMoney().net)+' ₽</b></span>' : '')+
    '<span class="chip net">Чистыми: <b>'+fmt(mm.profit)+' ₽</b></span>';
  $('#accBar').querySelector('b').textContent = srcName;
  $('#mCount').textContent = order.length;
  $('#mGross').textContent = fmt(t.gross)+' ₽';
  $('#mCut').textContent = (t.cut?'−':'')+fmt(t.cut)+' ₽';

  const box = $('#order');
  if (!order.length){
    box.innerHTML = '<div class="empty"><b>Заказ пуст</b>Нажмите «Добавить услугу», чтобы начать расчёт.</div>';
    return;
  }
  box.innerHTML = '';
  order.forEach((l, idx) => {
    const h = hint(l);
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML =
      '<div class="line-idx">'+(idx+1)+'</div>'+
      '<div class="line-main">'+
        '<div class="line-name"></div><div class="line-cat"></div>'+
        '<div class="line-ctl">'+
          '<div class="stepper"><button data-a="dec">−</button><span>'+l.qty+'</span><button data-a="inc">+</button></div>'+
          '<input class="price-edit" inputmode="numeric" value="'+fmt(l.price)+'" aria-label="Цена">'+
          '<span class="mult">₽</span>'+
          '<div class="line-sum">'+fmt(l.price*l.qty)+' ₽</div>'+
        '</div>'+
        '<div class="line-ctl" style="margin-top:7px">'+
          (l.p ? '<label class="wlab">Себест.</label>'+
                 '<input class="cost-edit" inputmode="numeric" value="'+fmt(+l.cost||0)+'" aria-label="Себестоимость">'+
                 '<span class="mult">₽</span>' : '')+
          rangeBtns(l)+
          '<label class="wlab">Гарантия</label>'+
          '<select class="wsel">'+W_OPTS.map(([v,t]) =>
             '<option value="'+v+'"'+((l.w==null?'':String(l.w))===v?' selected':'')+'>'+t+'</option>').join('')+
          '</select>'+
          '<span class="wnow">'+(warranty(l)?warranty(l)+' дн.':'—')+'</span>'+
        '</div>'+
        (h?'<div class="line-hint">'+h+'</div>':'')+
      '</div><button class="line-del" aria-label="Удалить">×</button>';
    el.querySelector('.line-name').textContent = nameOf(l);
    el.querySelector('.line-cat').textContent = catOf(l);
    el.querySelector('[data-a="inc"]').onclick = () => { l.qty++; render(); };
    el.querySelector('[data-a="dec"]').onclick = () => { l.qty>1 ? l.qty-- : order.splice(idx,1); render(); };
    el.querySelector('.line-del').onclick = () => { order.splice(idx,1); render(); };
    const pe = el.querySelector('.price-edit');
    pe.onfocus = () => { pe.value = l.price; pe.select(); };
    pe.onblur = () => { const v=parseInt(String(pe.value).replace(/[^0-9]/g,''),10); l.price=isNaN(v)?0:v; render(); };
    el.querySelector('.wsel').onchange = e => { l.w = e.target.value===''?null:e.target.value; render(); };
    const ce = el.querySelector('.cost-edit');
    if (ce){
      ce.onfocus = () => { ce.value = +l.cost||0; ce.select(); };
      ce.onblur  = () => { const v=parseInt(String(ce.value).replace(/[^0-9]/g,''),10); l.cost=isNaN(v)?0:v; render(); };
    }
    el.querySelectorAll('[data-set]').forEach(b => {
      b.onclick = () => { l.price = +b.dataset.set; render(); };
    });
    box.appendChild(el);
  });
}

// ---------- выбор услуги ----------
function drawList(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#list');
  box.innerHTML = '';

  if (mode === 'part'){ drawParts(q, box); return; }

  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя позиция (запчасть, материал)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = [];
    for (let i=0;i<svcs.length && hits.length<120;i++)
      if (svcs[i].t.toLowerCase().includes(q) || svcs[i].n.startsWith(q)) hits.push(i);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Ничего не нашлось. Попробуйте другое слово.</div>');
      return;
    }
    hits.forEach(i => box.appendChild(optRow(i,true)));
    return;
  }

  if (openCat === null){
    cats.forEach((c, ci) => {
      const n = svcs.filter(s=>s.c===ci).length;
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };
      box.appendChild(b);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className='crumb';
  crumb.innerHTML = '<button id="bBack">← Разделы</button><span></span>';
  crumb.querySelector('span').textContent = cats[openCat];
  box.appendChild(crumb);
  crumb.querySelector('#bBack').onclick = () => { openCat=null; drawList(); };
  svcs.forEach((s,i) => { if (s.c===openCat) box.appendChild(optRow(i,false)); });
}

function optRow(i, withCat){
  const s = svcs[i];
  const b = document.createElement('button');
  b.className='opt';
  b.innerHTML = '<div class="opt-main"><div class="opt-t"></div>'+
                (withCat?'<div class="opt-s">'+short[s.c]+'</div>':'')+
                '</div><div class="opt-p">'+priceText(s)+'</div>';
  b.querySelector('.opt-t').textContent = s.t;
  b.onclick = () => {
    const ex = order.find(l => !l.c && l.i===i);
    if (ex) ex.qty++; else order.push({i, price:s.p, qty:1});
    render();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),320);
  };
  return b;
}

function drawParts(q, box){
  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя деталь (нет в списке)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = parts.map((p,i)=>[p,i]).filter(([p]) => p.t.toLowerCase().includes(q)).slice(0,120);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Такой детали не нашлось. Добавьте её своей строкой.</div>');
      return;
    }
    hits.forEach(([p,i]) => box.appendChild(partRow(i,true)));
    return;
  }

  if (openPCat === null){
    pcats.forEach((c, ci) => {
      const n = parts.filter(p=>p.c===ci).length;
      const b = document.createElement('button');
      b.className='opt';
      b.innerHTML='<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openPCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };
      box.appendChild(b);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className='crumb';
  crumb.innerHTML='<button id="bBackP">← Категории</button><span></span>';
  crumb.querySelector('span').textContent = pcats[openPCat];
  box.appendChild(crumb);
  crumb.querySelector('#bBackP').onclick = () => { openPCat=null; drawList(); };
  parts.forEach((p,i) => { if (p.c===openPCat) box.appendChild(partRow(i,false)); });
}

function partRow(i, withCat){
  const p = parts[i];
  const b = document.createElement('button');
  b.className='opt';
  b.innerHTML = '<div class="opt-main"><div class="opt-t"></div>'+
                (withCat?'<div class="opt-s">'+pcats[p.c]+'</div>':'')+
                '</div><div class="opt-p">'+(p.w?'гар. '+p.w+' дн.':'—')+'</div>';
  b.querySelector('.opt-t').textContent = p.t;
  b.onclick = () => {
    order.push({p:true, pc:p.c, t:p.t, price:0, qty:1, cost:0, w:String(p.w)});
    render();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),320);
  };
  return b;
}

function addCustom(){
  const asPart = (mode === 'part');
  const t = prompt(asPart ? 'Название детали или материала:' : 'Название работы или услуги:');
  if (!t) return;
  const p = prompt('Цена для клиента за единицу, ₽:', '0');
  if (p === null) return;
  const v = parseInt(String(p).replace(/[^0-9]/g,''),10);
  const row = {c:true, t:t.trim(), price:isNaN(v)?0:v, qty:1, w:null};
  if (asPart){ row.p = true; row.pc = -1; row.cost = 0; }
  order.push(row);
  render();
}

const STATUSES = [
  {k:'new',    t:'Новый',     c:'#6B7A88'},
  {k:'work',   t:'В работе',  c:'#0A6FB8'},
  {k:'ready',  t:'Готов',     c:'#B26A00'},
  {k:'closed', t:'Закрыт',    c:'#1B6E2B'},
  {k:'cancel', t:'Отменён',   c:'#9A3412'},
];
const stOf = k => STATUSES.find(x => x.k === k) || STATUSES[0];

// ---------- файлы заказа ----------
// Тексты заказов остаются в обычном хранилище, а фото и документы —
// в IndexedDB: в обычном не хватит места даже на пару снимков.
let idb = null;
function openFiles(){
  return new Promise(res => {
    try{
      const rq = indexedDB.open('crm-files', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', {keyPath:'id'});
      };
      rq.onsuccess = () => { idb = rq.result; res(true); };
      rq.onerror   = () => { idb = null; res(false); };
    }catch(e){ idb = null; res(false); }
  });
}
function fileTx(mode){
  if (!idb) return null;
  try{ return idb.transaction('files', mode).objectStore('files'); }catch(e){ return null; }
}
function putFile(rec){
  return new Promise((res, rej) => {
    const st = fileTx('readwrite');
    if (!st) return rej(new Error('нет хранилища'));
    const rq = st.put(rec);
    rq.onsuccess = () => res(true);
    rq.onerror   = () => rej(rq.error || new Error('не записалось'));
  });
}
function getFile(id){
  return new Promise((res, rej) => {
    const st = fileTx('readonly');
    if (!st) return rej(new Error('нет хранилища'));
    const rq = st.get(id);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror   = () => rej(rq.error);
  });
}
function delFile(id){
  return new Promise(res => {
    const st = fileTx('readwrite');
    if (!st) return res(false);
    const rq = st.delete(id);
    rq.onsuccess = () => res(true);
    rq.onerror   = () => res(false);
  });
}

// ---------- журнал изменений ----------
function logTo(rec, what){
  rec.history = rec.history || [];
  rec.history.unshift({at: new Date().toISOString(), t: what});
  if (rec.history.length > 60) rec.history.length = 60;
}

// ---------- смета, зафиксированная до выезда ----------
// Раздел 3 заказ-наряда печатает её, раздел 4 — фактический список.

let estimate = null;     // {lines, discount, at}

function fixEstimate(){
  if (!order.length){ alert('Заказ пуст — нечего фиксировать.'); return; }
  estimate = {lines: JSON.parse(JSON.stringify(order)), discount, at: today()};
  alert('Смета зафиксирована: ' + order.length + ' поз. на ' + fmt(totals().net) + ' ₽.\n' +
        'Теперь можно добавлять работы — в разделе 3 останется исходная смета.');
  render();
}
function clearEstimate(){
  estimate = null;
  alert('Смета сброшена. Оба раздела снова показывают текущий список.');
  render();
}
function estMoney(){
  if (!estimate) return totals();
  const g = estimate.lines.reduce((a,l)=>a+l.price*l.qty,0);
  const c = Math.round(g*(estimate.discount||0)/100);
  return {gross:g, cut:c, net:g-c};
}

// ---------- расчёт денег по заказу ----------
// Комиссия агрегатора берётся только с работ; детали в базу не входят.
// Скидка уменьшает работы пропорционально, поэтому процент считается
// от той суммы за работы, которую реально заплатил клиент.
function money(lines, disc, srcRate, extra){
  let works = 0, partsSale = 0, partsCost = 0;
  (lines||[]).forEach(l => {
    const sum = l.price*l.qty;
    if (l.p){ partsSale += sum; partsCost += (+l.cost||0)*l.qty; }
    else     { works += sum; }
  });
  const gross = works + partsSale;
  const k = 1 - (disc||0)/100;
  const worksNet = works * k;
  const net = gross * k;
  const comm = Math.round(worksNet * (srcRate||0) / 100);
  const ex = +extra || 0;
  const revenue = net + ex;                      // оборот
  const profit  = net + ex - comm - partsCost;   // чистыми
  return {works, partsSale, partsCost, gross, worksNet:Math.round(worksNet),
          net:Math.round(net), comm, extra:ex,
          revenue:Math.round(revenue), profit:Math.round(profit)};
}
function curMoney(){
  const sr = sources[acc.src] ? sources[acc.src].r : 0;
  return money(order, discount, sr, acc.extra);

// при пересохранении не терять статус, комментарии, файлы и журнал
function mergeInto(rec){
  const old = store && store.find(r => r.id === rec.id);
  rec.status   = (old && old.status)   || 'new';
  rec.comments = (old && old.comments) || [];
  rec.files    = (old && old.files)    || [];
  rec.history  = (old && old.history)  || [];
  if (!old) logTo(rec, 'Заказ создан');
  else if (old.total !== rec.total) logTo(rec, 'Сумма изменена: ' + fmt(old.total) + ' → ' + fmt(rec.total) + ' ₽');
  else logTo(rec, 'Заказ сохранён');
  return rec;
}

function saveOrder(silent){
  if (!store){ if(!silent) alert('Телефон не разрешил приложению хранить данные — архив недоступен.'); return; }
  if (!order.length){ if(!silent) alert('Заказ пуст — нечего сохранять.'); return; }
  const rec = mergeInto(snapshot());
  curId = rec.id;
  const i = store.findIndex(r => r.id === rec.id);
  if (i >= 0) store[i] = rec; else store.unshift(rec);
  const ok = saveStore();
  if (!silent) alert(ok ? 'Заказ сохранён в архив.' : 'Не удалось сохранить — в телефоне кончилось место для данных.');
}

function openOrder(rec){
  order = JSON.parse(JSON.stringify(rec.lines));
  discount = rec.discount || 0;
  dsel.value = discount;
  Object.keys(C).forEach(k => delete C[k]);
  Object.assign(C, rec.fields || {});
  acc.extra = rec.extra || 0;
  acc.types = (rec.types || []).slice();
  const si = sources.findIndex(x => x.n === (rec.src && rec.src.n));
  acc.src = si >= 0 ? si : 0;
  curId = rec.id;
  render();
  $('#arch').classList.remove('on');
}

function delOrder(id){

  store = store.filter(r => r.id !== id);

}

// Минимальный генератор .xlsx без библиотек: zip без сжатия (метод store).
// Нужен, потому что приложение обязано работать офлайн — подключить SheetJS нельзя.

const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const enc = s => new TextEncoder().encode(s);

function zipStore(files){        // files: [{name, data:Uint8Array}]
  const parts = [], central = [];
  let offset = 0;

  for (const f of files){
    const nameB = enc(f.name), crc = crc32(f.data), len = f.data.length;
    const lf = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lf.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);      // version
    dv.setUint16(6, 0x0800, true);  // UTF-8 имена
    dv.setUint16(8, 0, true);       // store
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);  // время/дата — фиктивные
    dv.setUint32(14, crc, true);
    dv.setUint32(18, len, true);
    dv.setUint32(22, len, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    lf.set(nameB, 30);
    parts.push(lf, f.data);

    const cd = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, len, true);
    cv.setUint32(24, len, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameB, 46);
    central.push(cd);

    offset += lf.length + len;
  }

  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  const all = [...parts, ...central, end];
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const b of all){ out.set(b, p); p += b.length; }
  return out;
}

const xesc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName = i => {
  let s = '';
  i++;
  while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; }
  return s;
};

// rows: массив массивов. Значение — число, строка, или {v, b:true} для жирного
function sheetXml(rows, widths){
  let cols = '';
  if (widths && widths.length){
    cols = '<cols>' + widths.map((w, i) =>
      `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  const body = rows.map((r, ri) => {
    const cells = r.map((c, ci) => {
      const ref = colName(ci) + (ri + 1);
      if (c === null || c === undefined || c === '') return '';
      const bold = (typeof c === 'object' && c.b);
      const val = (typeof c === 'object') ? c.v : c;
      const style = bold ? ' s="1"' : (typeof val === 'number' ? ' s="2"' : '');
      if (typeof val === 'number')
        return `<c r="${ref}"${style}><v>${val}</v></c>`;
      return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`;
}

function buildXlsx(sheets){       // sheets: [{name, rows, widths}]
  const files = [];
  const n = sheets.length;

  files.push({name:'[Content_Types].xml', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)});

  files.push({name:'_rels/.rels', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});

  files.push({name:'xl/workbook.xml', data: enc(
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">

// ---------- выгрузка отчёта ----------
function exportXlsx(a){
  const H = v => ({v, b:true});
  const per = PERIODS.find(p => p[0]===period);
  const head = [
    ['Отчёт по заказам'],
    ['Период', per ? per[1] : '', a.from.toLocaleDateString('ru-RU') + ' — ' +
      new Date(a.to.getTime()-86400000).toLocaleDateString('ru-RU')],
    ['Сформирован', new Date().toLocaleString('ru-RU')],
    [],
  ];

  const orders = [
    ...head,
    [H('Дата'),H('Клиент'),H('Телефон'),H('Техника'),H('Источник'),H('Ставка, %'),
     H('Тип'),H('Работы'),H('Детали, продажа'),H('Скидка, %'),H('Доп. доход'),
     H('Оборот'),H('Комиссия'),H('Себест. деталей'),H('Чистыми')],
  ];
  a.rows.forEach(r => {
    const m = recMoney(r);
    orders.push([
      r.date, r.client||'', r.phone||'', r.device||'',
      (r.src&&r.src.n)||'—', (r.src&&r.src.r)||0,
      (r.types||[]).join(', '),
      m.works, m.partsSale, r.discount||0, m.extra,
      m.revenue, m.comm, m.partsCost, m.profit,
    ]);
  });
  orders.push([]);
  orders.push([H('ИТОГО'),'','','','','','',
    a.agg.works, a.agg.partsSale, '', a.agg.extra,
    a.agg.revenue, a.agg.comm, a.agg.partsCost, a.agg.profit]);

  const totals = [
    ...head,
    [H('Показатель'), H('Значение')],
    ['Заказов', a.rows.length],
    ['Оборот', a.agg.revenue],
    ['Средний чек', a.avg],
    ['Работы', a.agg.works],
    ['Детали (продажа)', a.agg.partsSale],
    ['Себестоимость деталей', a.agg.partsCost],
    ['Комиссия агрегаторов', a.agg.comm],
    ['Доход мимо агрегаторов', a.agg.extra],
    ['Чистый доход', a.agg.profit],
  ];

  const bySrc = [...head, [H('Источник'),H('Заказов'),H('Оборот'),H('Комиссия'),H('Чистыми')]];
  Object.entries(a.bySrc).sort((x,y)=>y[1].revenue-x[1].revenue)
    .forEach(([n,v]) => bySrc.push([n, v.n, v.revenue, v.comm, v.profit]));

  const byType = [...head, [H('Тип'),H('Заказов'),H('Оборот')]];
  Object.entries(a.byType).sort((x,y)=>y[1].revenue-x[1].revenue)
    .forEach(([n,v]) => byType.push([n, v.n, v.revenue]));

  const data = buildXlsx([
    {name:'Заказы',       rows:orders, widths:[11,20,15,18,16,9,14,10,13,9,11,11,11,13,11]},
    {name:'Итоги',        rows:totals, widths:[26,14]},
    {name:'По источникам',rows:bySrc,  widths:[22,10,12,12,12]},
    {name:'По типам',     rows:byType, widths:[18,10,12]},
  ]);

  const name = 'Отчёт_' + new Date().toISOString().slice(0,10) + '.xlsx';
  const blob = new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = (typeof File !== 'undefined') ? new File([blob], name, {type:blob.type}) : null;

  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement('a');
  a2.href = url; a2.download = name;
  document.body.appendChild(a2); a2.click();
  setTimeout(() => { URL.revokeObjectURL(url); a2.remove(); }, 1500);
}


// ---------- карточка заказа ----------
let cardId = null;

function openCard(id){
  cardId = id;
  buildCard();
  $('#card').classList.add('on');
}
function curRec(){ return store && store.find(r => r.id === cardId); }
function persist(msg){
  const r = curRec();
  if (r && msg) logTo(r, msg);
  saveStore();
  buildCard();
  if ($('#arch').classList.contains('on')) buildArch();
}

function buildCard(){
  const box = $('#cardBody');
  const r = curRec();
  box.innerHTML = '';
  if (!r){ box.innerHTML = '<div class="none">Заказ не найден.</div>'; return; }

  const head = document.createElement('div');
  head.className = 'fld';
  head.innerHTML = '<div style="font-size:17px;font-weight:600"></div>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:3px"></div>';
  head.children[0].textContent = r.client || 'Без имени';
  head.children[1].textContent = r.date + '  ·  ' + (r.device || 'техника не указана') +
      '  ·  ' + fmt(r.total) + ' ₽  ·  ' + ((r.src && r.src.n) || 'источник не указан');
  box.appendChild(head);

  sec(box, 'Статус');
  const ch = document.createElement('div'); ch.className='chips';
  STATUSES.forEach(st => {
    const b = document.createElement('button');
    const on = (r.status || 'new') === st.k;
    b.className = 'chip2' + (on ? ' on' : '');
    if (on){ b.style.background = st.c; b.style.borderColor = st.c; }
    else   { b.style.color = st.c; }
    b.textContent = st.t;
    b.onclick = () => {
      if ((r.status||'new') === st.k) return;
      r.status = st.k;
      persist('Статус: ' + st.t);
    };
    ch.appendChild(b);
  });
  box.appendChild(ch);

  sec(box, 'Комментарии');
  const add = document.createElement('div'); add.className='fld';
  add.innerHTML = '<textarea id="cmt" placeholder="Что важно помнить по этому заказу"></textarea>'+
    '<button class="btn btn-ghost" id="bCmt" style="margin-top:7px">Добавить</button>';
  box.appendChild(add);
  add.querySelector('#bCmt').onclick = () => {
    const v = add.querySelector('#cmt').value.trim();
    if (!v) return;
    r.comments = r.comments || [];
    r.comments.unshift({at: new Date().toISOString(), t: v});
    persist('Комментарий добавлен');
  };
  (r.comments || []).forEach((c, i) => {
    const d = document.createElement('div'); d.className='trow';
    d.innerHTML = '<span></span><button class="line-del" aria-label="Удалить">×</button>';
    const sp = d.querySelector('span');
    sp.textContent = c.t;
    const em = document.createElement('em');
    em.style.display = 'block';
    em.textContent = new Date(c.at).toLocaleString('ru-RU');
    sp.appendChild(em);
    d.querySelector('.line-del').onclick = () => {
      if (!confirm('Удалить комментарий?')) return;
      r.comments.splice(i,1); persist('Комментарий удалён');
    };
    box.appendChild(d);
  });

  sec(box, 'Фото и документы');
  const up = document.createElement('div'); up.className='fld';
  up.innerHTML = '<input type="file" id="fup" multiple accept="image/*,.pdf,.doc,.docx,.heic">'+
    '<div style="font-size:11.5px;color:var(--muted);margin-top:5px">Хранятся в этом телефоне, в облако не уходят</div>';
  box.appendChild(up);
  up.querySelector('#fup').onchange = async e => {
    const list = Array.from(e.target.files || []);
    if (!list.length) return;
    if (!idb){ alert('Телефон не дал доступ к хранилищу файлов — прикрепить не получится.'); return; }
    for (const f of list){
      const id = 'f' + Date.now() + Math.random().toString(36).slice(2,7);
      try{
        await putFile({id, blob: f, name: f.name, type: f.type});
        r.files = r.files || [];
        r.files.unshift({id, name: f.name, type: f.type, size: f.size, at: new Date().toISOString()});
      }catch(err){
        alert('Не удалось сохранить «' + f.name + '». Возможно, в телефоне кончилось место.');
      }
    }
    persist('Прикреплено файлов: ' + list.length);
  };
  (r.files || []).forEach((f, i) => {
    const d = document.createElement('div'); d.className='trow';
    d.innerHTML = '<span></span><button class="btn btn-ghost" style="min-height:34px;padding:0 10px">Открыть</button>'+
                  '<button class="line-del" aria-label="Удалить">×</button>';
    d.querySelector('span').textContent = f.name + '  ·  ' + Math.round((f.size||0)/1024) + ' КБ';
    d.querySelector('.btn').onclick = async () => {
      try{
        const rec = await getFile(f.id);
        if (!rec){ alert('Файл не найден в хранилище.'); return; }
        const url = URL.createObjectURL(rec.blob);
        window.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }catch(err){ alert('Не удалось открыть файл.'); }
    };
    d.querySelector('.line-del').onclick = async () => {
      if (!confirm('Удалить «' + f.name + '»?')) return;
      await delFile(f.id);
      r.files.splice(i,1);
      persist('Файл удалён');
    };
    box.appendChild(d);
  });

  sec(box, 'История изменений');
  (r.history || []).forEach(h => {
    const d = document.createElement('div'); d.className='trow';
    d.innerHTML = '<span></span>';
    const sp = d.querySelector('span');
    sp.textContent = h.t;
    const em = document.createElement('em');
    em.style.display = 'block';
    em.textContent = new Date(h.at).toLocaleString('ru-RU');
    sp.appendChild(em);
    box.appendChild(d);
  });

  const act = document.createElement('div');
  act.style.padding = '16px 14px 30px';
  act.innerHTML = '<button class="btn btn-main" id="bLoad" style="width:100%">Открыть в калькуляторе</button>';
  box.appendChild(act);
  act.querySelector('#bLoad').onclick = () => {
    if (order.length && !confirm('Открыть заказ? Текущий расчёт будет заменён.')) return;
    openOrder(r);
    $('#card').classList.remove('on');
  };
}

// ---------- аналитика ----------
let period = 'month';
let dFrom = '', dTo = '';

function periodRange(){
  const now = new Date();
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (period === 'today') return [d0, new Date(d0.getTime()+86400000)];
  if (period === 'week'){
    const wd = (d0.getDay()+6)%7;                  // понедельник — начало недели
    const from = new Date(d0.getTime() - wd*86400000);
    return [from, new Date(d0.getTime()+86400000)];
  }
  if (period === 'month') return [new Date(now.getFullYear(), now.getMonth(), 1),
                                  new Date(d0.getTime()+86400000)];
  if (period === 'year')  return [new Date(now.getFullYear(), 0, 1),
                                  new Date(d0.getTime()+86400000)];
  const f = dFrom ? new Date(dFrom+'T00:00:00') : new Date(2000,0,1);
  const t = dTo   ? new Date(dTo  +'T00:00:00') : d0;
  return [f, new Date(t.getTime()+86400000)];
}

function recMoney(r){
  // у старых записей учётных полей нет — считаем их прямыми заказами
  if (r.m) return r.m;
  return money(r.lines, r.discount, (r.src&&r.src.r)||0, r.extra||0);
}

function analData(){
  if (!store) return null;
  const [from, to] = periodRange();
  const rows = store.filter(r => {
    const d = new Date(r.saved);
    return d >= from && d < to;
  }).sort((a,b) => new Date(b.saved) - new Date(a.saved));

  const agg = {revenue:0, profit:0, comm:0, partsCost:0, extra:0, works:0, partsSale:0};
  const bySrc = {}, byType = {};
  rows.forEach(r => {
    const m = recMoney(r);
    ['revenue','profit','comm','partsCost','extra','works','partsSale'].forEach(k => agg[k] += (m[k]||0));
    const sn = (r.src && r.src.n) || 'Не указан';
    bySrc[sn] = bySrc[sn] || {n:0, revenue:0, profit:0, comm:0};
    bySrc[sn].n++; bySrc[sn].revenue += m.revenue; bySrc[sn].profit += m.profit; bySrc[sn].comm += m.comm;
    const ts = (r.types && r.types.length) ? r.types : ['Без типа'];
    ts.forEach(t => {
      byType[t] = byType[t] || {n:0, revenue:0};
      byType[t].n++; byType[t].revenue += m.revenue;
    });
  });
  const avg = rows.length ? Math.round(agg.revenue/rows.length) : 0;
  return {rows, agg, bySrc, byType, avg, from, to};
}

const PERIODS = [['today','Сегодня'],['week','Неделя'],['month','Месяц'],['year','Год'],['custom','Свой']];

function buildAnal(){
  const box = $('#analBody');
  box.innerHTML = '';

  const ch = document.createElement('div'); ch.className='chips';
  PERIODS.forEach(([k,t]) => {
    const b = document.createElement('button');
    b.className = 'chip2' + (period===k ? ' on' : '');
    b.textContent = t;
    b.onclick = () => { period = k; buildAnal(); };
    ch.appendChild(b);
  });
  box.appendChild(ch);

  if (period === 'custom'){
    const d = document.createElement('div'); d.className='dates';
    d.innerHTML = '<input type="date" id="dF" value="'+dFrom+'"><input type="date" id="dT" value="'+dTo+'">';
    box.appendChild(d);
    d.querySelector('#dF').onchange = e => { dFrom = e.target.value; buildAnal(); };
    d.querySelector('#dT').onchange = e => { dTo = e.target.value; buildAnal(); };
  }

  const a = analData();
  if (!a){
    box.insertAdjacentHTML('beforeend','<div class="none">Архив недоступен — телефон не разрешил хранить данные.</div>');
    return;
  }
  if (!a.rows.length){
    box.insertAdjacentHTML('beforeend','<div class="none">За этот период заказов нет.</div>');
    return;
  }

  const k = document.createElement('div'); k.className='kpis';
  k.innerHTML =
    kpi('Оборот', a.agg.revenue) +
    kpi('Чистыми', a.agg.profit, 'good') +
    '<div class="kpi"><i>Заказов</i><b>'+a.rows.length+'</b></div>' +
    kpi('Средний чек', a.avg) +
    kpi('Комиссия агрегаторов', a.agg.comm, 'bad') +
    kpi('Себестоимость деталей', a.agg.partsCost, 'bad');
  box.appendChild(k);

  if (a.agg.extra){
    const e = document.createElement('div'); e.className='kpis';
    e.innerHTML = kpi('Доход мимо агрегаторов', a.agg.extra) +
                  kpi('Продажа деталей', a.agg.partsSale);
    box.appendChild(e);
  }

  sec(box, 'По источникам');
  Object.entries(a.bySrc).sort((x,y)=>y[1].revenue-x[1].revenue).forEach(([n,v]) => {
    const r = document.createElement('div'); r.className='trow';
    r.innerHTML = '<span></span><b>'+fmt(v.revenue)+' ₽</b>';
    r.querySelector('span').innerHTML = '';
    r.querySelector('span').append(n);
    const em = document.createElement('em');
    em.textContent = '  ·  ' + v.n + ' зак.' + (v.comm ? '  ·  комиссия ' + fmt(v.comm) + ' ₽' : '');
    r.querySelector('span').appendChild(em);
    box.appendChild(r);
  });

  sec(box, 'По типам');
  Object.entries(a.byType).sort((x,y)=>y[1].revenue-x[1].revenue).forEach(([n,v]) => {
    const r = document.createElement('div'); r.className='trow';
    r.innerHTML = '<span></span><b>'+fmt(v.revenue)+' ₽</b>';
    r.querySelector('span').textContent = n + '  ·  ' + v.n + ' зак.';
    box.appendChild(r);
  });

  sec(box, 'Заказы за период');
  a.rows.forEach(r => {
    const m = recMoney(r);
    const el = document.createElement('div'); el.className='trow';
    el.innerHTML = '<span></span><b>'+fmt(m.revenue)+' ₽</b>';
    el.querySelector('span').textContent =
      r.date + '  ·  ' + (r.client || 'без имени') + '  ·  ' + ((r.src&&r.src.n)||'—');
    box.appendChild(el);
  });

  const btn = document.createElement('div');
  btn.style.padding = '16px 14px 30px';
  btn.innerHTML = '<button class="btn btn-main" id="bXls" style="width:100%">Выгрузить в Excel</button>';
  box.appendChild(btn);
  btn.querySelector('#bXls').onclick = () => exportXlsx(a);
}
function sec(box, t){
  const d = document.createElement('div'); d.className='tsec'; d.textContent = t; box.appendChild(d);
}

// ---------- документы ----------
const fill = (v,w) => v && String(v).trim()
  ? '<span class="fill">'+esc(v)+'</span>'
  : '<span class="fill" style="min-width:'+(w||120)+'px">&nbsp;</span>';

function rowsTable(cols, src){
  const list = src || order;
  // cols: 'full' — №/наим/кол/цена/стоим/гарантия ; 'short' — №/наим/стоим/гарантия
  let h = '<table><tr>';
  h += cols==='full'
    ? '<th style="width:6%">№</th><th>Наименование услуг, деталей и материалов</th><th style="width:9%">Кол-во</th><th style="width:13%">Цена</th><th style="width:14%">Стоимость</th><th style="width:13%">Гарантия, дней</th>'
    : '<th style="width:6%">№</th><th>Наименование услуг, деталей и материалов</th><th style="width:18%">Стоимость, руб.</th><th style="width:15%">Гарантия</th>';
  h += '</tr>';
  list.forEach((l,i) => {
    const sum = l.price*l.qty, w = warranty(l);
    h += '<tr><td class="n">'+(i+1)+'</td><td>'+esc(nameOf(l))+'</td>';
    h += cols==='full'
      ? '<td class="c">'+l.qty+'</td><td class="r">'+fmt(l.price)+'</td><td class="r">'+fmt(sum)+'</td><td class="c">'+(w?w:'—')+'</td>'
      : '<td class="r">'+fmt(sum)+'</td><td class="c">'+(w?w+' дн.':'—')+'</td>';
    h += '</tr>';
  });
  const need = list.length ? 0 : 3;   // пустые строки только для незаполненного бланка
  for (let i=0;i<need;i++)
    h += '<tr><td class="n">&nbsp;</td><td></td><td></td><td></td>'+(cols==='full'?'<td></td><td></td>':'')+'</tr>';
  return h + '</table>';
}

function moneyBlock(){
  const t = totals();
  let h = '<p class="tot"><b>Общая цена работ и материалов:</b> '+fill(fmt(t.gross)+' руб.');
  h += ' &nbsp; <b>Сумма скидки:</b> '+fill((t.cut?fmt(t.cut):'0')+' руб.');
  h += ' &nbsp; <b>Сумма итого:</b> '+fill(fmt(t.net)+' руб.')+'</p>';
  h += '<p class="tot"><b>Внесен аванс:</b> '+fill(C.prepay?fmt(+String(C.prepay).replace(/[^0-9]/g,''))+' руб.':'')+'</p>';
  return h;
}


// Подпись Исполнителя: сюда встанет прозрачный PNG, когда будет фото.
// Пока пусто — Исполнитель тоже расписывается пальцем.
const EXEC_SIGN = DB.sign || '';

function sigOne(who, tag){
  const id = who+'-'+tag;
  const inner = (who==='exec' && EXEC_SIGN)
    ? '<img class="sigimg" src="'+EXEC_SIGN+'" alt="Подпись">'
    : '<canvas class="sigpad" data-pad="'+id+'"></canvas>';
  const cap = who==='exec' ? 'Савинов Д.В.' : (esc(C.client||'') || '____________________');
  return '<div class="sigbox">'+inner+'</div><div class="sigcap">'+cap+'</div>'+
    ((who==='exec' && EXEC_SIGN) ? ''
      : '<button class="sigclr" data-clr="'+id+'">Очистить</button>'+
        '<div class="sighint">Распишитесь пальцем в рамке выше</div>');
}
function sigPair(l, r, tag, extra){
  return '<div class="sig"><div><b>'+l+'</b>'+sigOne('exec',tag)+'</div>'+
         '<div><b>'+r+'</b>'+sigOne('client',tag)+(extra||'')+'</div></div>';
}

function initPads(){
  const usePointer = !!window.PointerEvent;
  document.querySelectorAll('#docBody .sigpad').forEach(cv => {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 260, h = 72;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.lineWidth = 1.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#000';
    let on = false;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return [p.clientX-r.left, p.clientY-r.top];
    };
    const start = e => { e.preventDefault(); on=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
    const move  = e => { if(!on) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
    const end   = () => { on=false; };
    if (usePointer){
      cv.addEventListener('pointerdown',start);
      cv.addEventListener('pointermove',move);
      cv.addEventListener('pointerup',end);
      cv.addEventListener('pointercancel',end);
      cv.addEventListener('pointerleave',end);
    } else {
      cv.addEventListener('touchstart',start,{passive:false});
      cv.addEventListener('touchmove',move,{passive:false});
      cv.addEventListener('touchend',end);
      cv.addEventListener('mousedown',start);
      cv.addEventListener('mousemove',move);
      cv.addEventListener('mouseup',end);
    }
  });
  document.querySelectorAll('#docBody .sigclr').forEach(b => {
    b.onclick = () => {
      const cv = document.querySelector('#docBody .sigpad[data-pad="'+b.dataset.clr+'"]');
      if (cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    };
  });
}

let pinBuf = '';
function drawDots(){
  const d = $('#lockDots');
  d.innerHTML = '';
  for (let i = 0; i < 4; i++){
    const e = document.createElement('i');
    if (i < pinBuf.length) e.className = 'on';
    d.appendChild(e);
  }
}
function buildPad(){
  const pad = $('#pad');
  pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','C','0','←'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    if (k === 'C' || k === '←') b.className = 'wide';
    b.onclick = () => {
      if (k === 'C'){ pinBuf = ''; }
      else if (k === '←'){ pinBuf = pinBuf.slice(0,-1); }
      else if (pinBuf.length < 4){ pinBuf += k; }
      drawDots();
      $('#lockErr').textContent = '';
      if (pinBuf.length === 4) setTimeout(tryPin, 120);
    };
    pad.appendChild(b);
  });
  drawDots();
}
function tryPin(){
  if (pinBuf === curPin()){
    pinBuf = '';
    $('#lock').classList.add('off');
    drawDots();
  } else {
    pinBuf = '';
    drawDots();
    $('#lockErr').textContent = 'Неверный код';
  }
}
function lockNow(){
  pinBuf = ''; drawDots();
  $('#lockErr').textContent = '';
  $('#lock').classList.remove('off');
}

  const b = prompt('Повторите код:');

  alert(setPin(v) ? 'Код изменён.' : 'Не удалось сохранить код.');
}

function exportBackup(){
  if (!store){ alert('Архив недоступен.'); return; }
  const data = JSON.stringify({v:1, at:new Date().toISOString(), orders:store, sources}, null, 1);
  const blob = new Blob([data], {type:'application/json'});
  const name = 'Резервная_копия_' + new Date().toISOString().slice(0,10) + '.json';
  const f = (typeof File !== 'undefined') ? new File([blob], name, {type:blob.type}) : null;
  if (f && navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f], title:name}).catch(()=>{});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d.orders) throw new Error('не тот файл');
        if (!confirm('В копии заказов: ' + d.orders.length + '. Заменить текущий архив?')) return;
        store = d.orders;
        if (d.sources) { sources = d.sources; saveSources(); }
        saveStore();
        alert('Копия загружена. Фото и документы в копию не входят.');
        render();
      }catch(e){ alert('Файл не похож на резервную копию.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

const PAGE_H = 1047;        // 297 мм минус поля 2×10 мм, при 96 dpi
const MIN_ZOOM = 0.5;       // ниже — уже нечитаемо, лучше отдать две страницы

function fitAndPrint(){
  const page = $('#docBody');
  page.style.zoom = '';
  document.body.classList.add('printing');
  requestAnimationFrame(() => {
    const h = page.scrollHeight;
    let z = h > PAGE_H ? PAGE_H/h : 1;
    if (z < MIN_ZOOM) z = MIN_ZOOM;
    page.style.zoom = z;
    setTimeout(() => {
      window.print();
      setTimeout(unfit, 400);
    }, 60);
  });
}
function unfit(){
  document.body.classList.remove('printing');
  $('#docBody').style.zoom = '';
}
window.addEventListener('afterprint', unfit);

    if (navigator.share){ await navigator.share({text:s}); return; }
    await navigator.clipboard.writeText(s);
    alert('Расчёт скопирован — вставьте в мессенджер.');
  }catch(e){ alert(s); }
}

initKnob();
buildPad();
openFiles();          // хранилище файлов — если не дадут, приложение живёт без фото
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
