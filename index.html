<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прайс">
<meta name="theme-color" content="#26303A">
<title>Калькулятор услуг</title>
<style>
:root{
  --slab:#26303A; --slab-2:#1B242C;
  --lcd:#C9D4C5; --lcd-ink:#161E15; --lcd-dim:#5A6858;
  --bg:#E9ECEE; --surface:#FFFFFF;
  --ink:#13202A; --muted:#5E6B75; --hair:#D3D9DD;
  --signal:#0A6FB8; --danger:#B3261E;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- прибор ---------- */
.rig{background:var(--slab);color:#DCE3E8;position:sticky;top:0;z-index:20;
     padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
     box-shadow:0 2px 10px rgba(0,0,0,.25)}
.rig-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.rig-title{font-size:13px;letter-spacing:.02em;color:#9FB0BC}
.rig-date{font-size:12px;color:#7E909D;font-variant-numeric:tabular-nums}

.readout{background:var(--lcd);border-radius:5px;padding:9px 13px 11px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.38), 0 1px 0 rgba(255,255,255,.08);
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
.readout-label{font-size:11px;color:var(--lcd-dim);letter-spacing:.04em}
.readout-value{font-size:clamp(2.1rem,11.5vw,3rem);font-weight:600;color:var(--lcd-ink);
  line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  display:flex;align-items:baseline;gap:.18em}
.readout-value .cur{font-size:.42em;font-weight:500;color:var(--lcd-dim)}
.meters{display:flex;gap:1px;margin-top:9px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.meter{flex:1;background:var(--slab-2);padding:7px 9px;min-width:0}
.meter-k{font-size:10.5px;color:#8798A4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;color:#E4EBF0;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-v.cut{color:#F2B441}
.disc{margin-top:9px;display:flex;align-items:center;gap:9px}
.disc label{font-size:12.5px;color:#9FB0BC}
.disc select{background:var(--slab-2);color:#E4EBF0;border:1px solid #3B4854;
  border-radius:5px;padding:7px 10px;min-height:var(--tap);flex:1;
  font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239FB0BC' stroke-width='1.8'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}

/* ---------- позиции ---------- */
.empty{padding:52px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:17px}
.line{background:var(--surface);border-bottom:1px solid var(--hair);padding:11px 14px;display:flex;gap:11px}
.line-idx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  padding-top:3px;min-width:17px;font-variant-numeric:tabular-nums}
.line-main{flex:1;min-width:0}
.line-name{font-size:15px;line-height:1.3;margin-bottom:2px}
.line-cat{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.line-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:19px;color:var(--signal);line-height:1}
.stepper button:active{background:#EAF3FA}
.stepper span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);height:38px;line-height:38px}
.price-edit{border:1px solid var(--hair);border-radius:7px;padding:0 9px;height:38px;width:92px;
  text-align:right;font-variant-numeric:tabular-nums;background:#FBFCFC;-webkit-appearance:none}
.price-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.mult{color:var(--muted);font-size:14px}
.line-sum{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.line-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.line-del{align-self:flex-start;width:32px;height:32px;color:var(--muted);font-size:20px;line-height:1}
.line-del:active{color:var(--danger)}

/* ---------- нижняя панель ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--hair);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.btn{min-height:var(--tap);border-radius:9px;padding:0 16px;font-size:15.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-main{background:var(--signal);color:#fff;flex:1}
.btn-main:active{background:#095C99}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);background:#fff}
.btn-ghost:active{background:#F1F4F6}

/* ---------- выбор услуги ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--hair);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.sheet-row{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.search{flex:1;height:var(--tap);border:1px solid var(--hair);border-radius:9px;
  padding:0 12px;background:#F4F6F7;-webkit-appearance:none}
.search:focus{background:#fff;border-color:var(--signal);outline:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body-in{max-width:560px;margin:0 auto}
.crumb{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);font-size:13px;
  background:#DFE4E7;position:sticky;top:0}
.crumb button{color:var(--signal);font-size:14px;min-height:32px}
.opt{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:center;min-height:var(--tap)}
.opt:active{background:#EAF3FA}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:15px;line-height:1.3}
.opt-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt-p{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-cnt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.opt.hit{background:#DCEFD8}
.none{padding:38px 22px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="rig">
    <div class="rig-top">
      <span class="rig-title">Расчёт заказа</span>
      <span class="rig-date" id="date"></span>
    </div>
    <div class="readout">
      <div class="readout-label">Итого к оплате</div>
      <div class="readout-value"><span id="total">0</span><span class="cur">₽</span></div>
    </div>
    <div class="meters">
      <div class="meter"><div class="meter-k">Позиций</div><div class="meter-v" id="mCount">0</div></div>
      <div class="meter"><div class="meter-k">Без скидки</div><div class="meter-v" id="mGross">0 ₽</div></div>
      <div class="meter"><div class="meter-k">Скидка</div><div class="meter-v cut" id="mCut">0 ₽</div></div>
    </div>
    <div class="disc">
      <label for="disc">Скидка</label>
      <select id="disc"></select>
    </div>
  </header>

  <main id="order"></main>
</div>

<div class="bar">
  <div class="bar-in">
    <button class="btn btn-ghost" id="bNew">Новый</button>
    <button class="btn btn-main" id="bAdd">Добавить услугу</button>
    <button class="btn btn-ghost" id="bShare">Итог</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-top">
    <div class="sheet-row">
      <input class="search" id="q" type="search" placeholder="Поиск по названию" autocomplete="off">
      <button class="btn btn-ghost" id="bDone">Готово</button>
    </div>
  </div>
  <div class="sheet-body"><div class="sheet-body-in" id="list"></div></div>
</div>

  if (s.k==='d') return 'договорная';
  if (s.k==='o') return 'от ' + fmt(s.p) + ' ₽';
  if (s.x)       return fmt(s.p) + '–' + fmt(s.x) + ' ₽';
  return fmt(s.p) + ' ₽';
}
function hint(s){
  if (s.k==='d') return 'Цена договорная — впишите свою';
  if (s.k==='o') return 'Цена «от» — можно увеличить';
  if (s.x)       return 'Вилка ' + fmt(s.p) + '–' + fmt(s.x) + ' ₽';
  return '';
}

// ---------- расчёт ----------
function totals(){
  const gross = order.reduce((a,l) => a + l.price*l.qty, 0);
  const cut = Math.round(gross*discount/100);
  return {gross, cut, net: gross-cut};
}

function render(){
  const t = totals();
  $('#total').textContent = fmt(t.net);
  $('#mCount').textContent = order.length;
  $('#mGross').textContent = fmt(t.gross) + ' ₽';
  $('#mCut').textContent = (t.cut? '−':'') + fmt(t.cut) + ' ₽';

  const box = $('#order');
  if (!order.length){
    box.innerHTML = '<div class="empty"><b>Заказ пуст</b>Нажмите «Добавить услугу», чтобы начать расчёт.</div>';
    return;
  }
  box.innerHTML = '';
  order.forEach((l, idx) => {
    const s = svcs[l.i];
    const h = hint(s);
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML =
      '<div class="line-idx">'+(idx+1)+'</div>'+
      '<div class="line-main">'+
        '<div class="line-name"></div>'+
        '<div class="line-cat">'+short[s.c]+'</div>'+
        '<div class="line-ctl">'+
          '<div class="stepper">'+
            '<button data-a="dec" aria-label="Меньше">−</button>'+
            '<span>'+l.qty+'</span>'+
            '<button data-a="inc" aria-label="Больше">+</button>'+
          '</div>'+
          '<input class="price-edit" inputmode="numeric" value="'+fmt(l.price)+'" aria-label="Цена">'+
          '<span class="mult">₽</span>'+
          '<div class="line-sum">'+fmt(l.price*l.qty)+' ₽</div>'+
        '</div>'+
        (h? '<div class="line-hint">'+h+'</div>' : '')+
      '</div>'+
      '<button class="line-del" aria-label="Удалить">×</button>';
    el.querySelector('.line-name').textContent = s.t;

    el.querySelector('[data-a="inc"]').onclick = () => { l.qty++; render(); };
    el.querySelector('[data-a="dec"]').onclick = () => {
      if (l.qty>1){ l.qty--; } else { order.splice(idx,1); }
      render();
    };
    el.querySelector('.line-del').onclick = () => { order.splice(idx,1); render(); };
    const pe = el.querySelector('.price-edit');
    pe.onfocus = () => { pe.value = l.price; pe.select(); };
    pe.onblur = () => {
      const v = parseInt(String(pe.value).replace(/[^0-9]/g,''),10);
      l.price = isNaN(v)? 0 : v;
      render();
    };
    box.appendChild(el);
  });
}

// ---------- выбор услуги ----------
function drawList(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#list');
  box.innerHTML = '';

  if (q){
    const hits = [];
    for (let i=0;i<svcs.length;i++){
      if (svcs[i].t.toLowerCase().includes(q) || svcs[i].n.startsWith(q)) hits.push(i);
      if (hits.length>=120) break;
    }
    if (!hits.length){ box.innerHTML = '<div class="none">Ничего не нашлось. Попробуйте другое слово.</div>'; return; }
    hits.forEach(i => box.appendChild(optRow(i, true)));
    return;
  }

  if (openCat === null){
    cats.forEach((c, ci) => {
      const n = svcs.filter(s => s.c===ci).length;
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openCat = ci; drawList(); document.querySelector('.sheet-body').scrollTop = 0; };
      box.appendChild(b);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className = 'crumb';
  crumb.innerHTML = '<button id="bBack">← Разделы</button><span></span>';
  crumb.querySelector('span').textContent = cats[openCat];
  box.appendChild(crumb);
  crumb.querySelector('#bBack').onclick = () => { openCat = null; drawList(); };

  svcs.forEach((s, i) => { if (s.c===openCat) box.appendChild(optRow(i, false)); });
}

function optRow(i, withCat){
  const s = svcs[i];
  const b = document.createElement('button');
  b.className = 'opt';
  b.innerHTML = '<div class="opt-main"><div class="opt-t"></div>'+
                (withCat? '<div class="opt-s">'+short[s.c]+'</div>':'')+
                '</div><div class="opt-p">'+priceText(s)+'</div>';
  b.querySelector('.opt-t').textContent = s.t;
  b.onclick = () => {
    const ex = order.find(l => l.i===i);
    if (ex) ex.qty++; else order.push({i, price: s.p, qty: 1});
    render();
    b.classList.add('hit');
    setTimeout(()=>b.classList.remove('hit'), 320);
  };
  return b;
}

$('#q').addEventListener('input', drawList);
$('#bAdd').onclick = () => {
  openCat = null; $('#q').value = '';
  drawList();
  $('#sheet').classList.add('on');
};
$('#bDone').onclick = () => $('#sheet').classList.remove('on');

$('#bNew').onclick = () => {
  if (order.length && !confirm('Очистить заказ и начать заново?')) return;
  order = []; discount = 0; dsel.value = 0; render();
};

// ---------- итог текстом ----------
$('#bShare').onclick = async () => {
  if (!order.length){ alert('Заказ пуст.'); return; }
  const t = totals();
  const d = new Date().toLocaleDateString('ru-RU');
  let s = 'Расчёт работ от ' + d + '\n\n';
  order.forEach((l, n) => {
    s += (n+1) + '. ' + svcs[l.i].t + '\n   ' +
         (l.qty>1 ? l.qty + ' × ' + fmt(l.price) + ' ₽ = ' : '') +
         fmt(l.price*l.qty) + ' ₽\n';
  });
  s += '\nСумма: ' + fmt(t.gross) + ' ₽';
  if (t.cut) s += '\nСкидка ' + discount + '%: −' + fmt(t.cut) + ' ₽';
  s += '\nИтого к оплате: ' + fmt(t.net) + ' ₽';
  s += '\n\nСавинов Д.В. — ремонт компьютеров, ТВ и смартфонов';

  try{
    if (navigator.share){ await navigator.share({text:s}); return; }
    await navigator.clipboard.writeText(s);
    alert('Расчёт скопирован — вставьте в мессенджер.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.style.cssText = 'position:fixed;inset:10% 5%;width:90%;height:70%;z-index:99;font-size:14px';
    document.body.appendChild(ta); ta.select();
    alert('Скопируйте текст вручную, затем нажмите ОК.');
    ta.remove();
  }
};

render();

// офлайн-закрепление (работает только по https, т.е. на GitHub Pages)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
