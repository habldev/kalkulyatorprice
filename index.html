<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Расчёт">
<meta name="theme-color" content="#26303A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>Калькулятор услуг</title>
<style>
:root{
  --slab:#26303A; --slab-2:#1B242C;
  --lcd:#C9D4C5; --lcd-ink:#161E15; --lcd-dim:#5A6858;
  --bg:#E9ECEE; --surface:#FFFFFF;
  --ink:#13202A; --muted:#5E6B75; --hair:#D3D9DD;
  --signal:#0A6FB8; --danger:#B3261E;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- корпус прибора ---------- */
.rig{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;
  background:
    linear-gradient(180deg,#323E49 0%,#26303A 42%,#1E2831 100%);
  box-shadow:0 3px 14px rgba(0,0,0,.35)}
.plate{position:relative;border-radius:12px;padding:12px 13px 13px;
  background:
    repeating-linear-gradient(97deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(165deg,#3A4653 0%,#2B3641 55%,#222C35 100%);
  border:1px solid #47545F;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 8px rgba(0,0,0,.30)}
/* винты по углам */
.plate::before,.plate::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#8A98A4,#4B5762 60%,#39434D);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);top:7px}
.plate::before{left:7px} .plate::after{right:7px}

.rig-top{display:flex;align-items:baseline;justify-content:space-between;margin:0 14px 9px}
.rig-brand{font-size:10.5px;letter-spacing:.16em;color:#93A3B0;text-transform:uppercase}
.rig-date{font-size:11px;color:#7E909D;font-variant-numeric:tabular-nums}

/* ---------- жидкокристаллическое табло ---------- */
.lcd{border-radius:6px;padding:3px;
  background:linear-gradient(180deg,#171E24,#232D35);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.lcd-face{position:relative;border-radius:4px;padding:8px 11px 9px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,#D3DCCD 0%,#C4CFC0 55%,#B6C2B2 100%)}
.lcd-face::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px)}
.lcd-label{font:11px/1 ui-monospace,Menlo,monospace;color:#5F6D5D;letter-spacing:.08em}
.lcd-digits{margin:5px 0 2px;min-height:52px;display:flex;align-items:flex-end}
.lcd-digits svg{width:100%;height:auto;max-height:64px;display:block}
.lcd-sub{display:flex;gap:10px;border-top:1px solid rgba(22,30,21,.22);padding-top:6px}
.sub{flex:1;min-width:0}
.sub i{display:block;font:normal 9.5px/1.2 ui-monospace,Menlo,monospace;color:#66755F}
.sub b{display:block;font:600 13px/1.25 ui-monospace,Menlo,monospace;color:#1B2419;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b.cut{color:#7A4A12}

/* ---------- поворотный регулятор ---------- */
.accbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.accbar .chip{border:1px solid #47545F;background:#222C35;color:#C7D5E0;border-radius:7px;
  padding:6px 9px;font-size:12px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.accbar .chip b{color:#F2B441;font-variant-numeric:tabular-nums}
.accbar .chip.net b{color:#8FD694}
.knobrow{display:flex;align-items:center;gap:13px;margin-top:11px}
.knob{width:108px;height:108px;flex:none;touch-action:none;cursor:grab}
.knob:active{cursor:grabbing}
.knob svg{width:100%;height:100%;display:block}
.knob:focus-visible{outline:2px solid #7FB7E0;outline-offset:3px;border-radius:50%}
.knobinfo{min-width:0}
.knobcap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#93A3B0}
.knobval{font:600 26px/1.15 ui-monospace,Menlo,monospace;color:#F2B441;
  font-variant-numeric:tabular-nums;margin:1px 0 3px}
.knobhint{font-size:11px;color:#7E909D;line-height:1.3}

.empty{padding:52px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:17px}
.line{background:var(--surface);border-bottom:1px solid var(--hair);padding:11px 14px;display:flex;gap:11px}
.line-idx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  padding-top:3px;min-width:17px;font-variant-numeric:tabular-nums}
.line-main{flex:1;min-width:0}
.line-name{font-size:15px;line-height:1.3;margin-bottom:2px}
.line-cat{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.line-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:19px;color:var(--signal);line-height:1}
.stepper button:active{background:#EAF3FA}
.stepper span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);height:38px;line-height:38px}
.price-edit{border:1px solid var(--hair);border-radius:7px;padding:0 9px;height:38px;width:92px;
  text-align:right;font-variant-numeric:tabular-nums;background:#FBFCFC;-webkit-appearance:none}
.price-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.mult{color:var(--muted);font-size:14px}
.line-sum{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.line-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.wlab{font-size:11.5px;color:var(--muted)}
.wsel{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 6px;background:#FBFCFC}
.cost-edit{border:1px solid var(--hair);border-radius:7px;height:34px;width:78px;padding:0 8px;
  text-align:right;background:#FFF6E5;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.cost-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.wnow{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 9px;
  font-size:12.5px;color:var(--signal);background:#fff;font-variant-numeric:tabular-nums}
.mini:active{background:#EAF3FA}
.seg{flex:1;height:38px;border:1px solid var(--hair);border-radius:8px;background:#fff;font-size:14.5px}
.seg.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.line-del{align-self:flex-start;width:32px;height:32px;color:var(--muted);font-size:20px;line-height:1}
.line-del:active{color:var(--danger)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--hair);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.btn{min-height:var(--tap);border-radius:9px;padding:0 15px;font-size:15.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-main{background:var(--signal);color:#fff;flex:1}
.btn-main:active{background:#095C99}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);background:#fff}
.btn-ghost:active{background:#F1F4F6}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--hair);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.sheet-row{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.sheet-h{flex:1;font-size:16px;font-weight:600}
.search{flex:1;height:var(--tap);border:1px solid var(--hair);border-radius:9px;padding:0 12px;
  background:#F4F6F7;-webkit-appearance:none}
.search:focus{background:#fff;border-color:var(--signal);outline:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body-in{max-width:560px;margin:0 auto;padding-bottom:30px}
.crumb{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);font-size:13px;
  background:#DFE4E7;position:sticky;top:0}
.crumb button{color:var(--signal);font-size:14px;min-height:32px}
.opt{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:center;min-height:var(--tap)}
.opt:active{background:#EAF3FA}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:15px;line-height:1.3}
.opt-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt-p{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-cnt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.opt.hit{background:#DCEFD8}
.opt.act .opt-t{color:var(--signal)}
.none{padding:38px 22px;text-align:center;color:var(--muted)}

.screen{display:block}
.screen.off{display:none}
.bar.off{display:none}
.fhead{background:linear-gradient(180deg,#323E49,#242E38);color:#DCE3E8;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.28)}
.fhead-top{display:flex;align-items:baseline;justify-content:space-between;
  max-width:560px;margin:0 auto 9px}
.fkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;max-width:560px;
  margin:0 auto;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;text-align:left}
.fkpi div{background:#1F2831;padding:9px 10px;min-width:0}
.fkpi i{display:block;font:normal 10px/1.2 inherit;color:#8798A4;white-space:nowrap}
.fkpi b{display:block;font:600 16px/1.25 ui-monospace,Menlo,monospace;color:#E4EBF0;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fkpi b.good{color:#8FD694}
.ford{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:flex-start;min-height:var(--tap)}
.ford:active{background:#EAF3FA}
.ford-main{flex:1;min-width:0}
.ford-t{font-size:15.5px;display:flex;align-items:center;gap:7px}
.ford-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.ford-r{text-align:right;white-space:nowrap}
.ford-sum{font:600 15px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ford-st{font-size:10.5px;margin-top:3px}
.lock{position:fixed;inset:0;z-index:90;background:var(--slab);display:flex;
  align-items:center;justify-content:center;padding:24px}
.lock.off{display:none}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-t{color:#C7D5E0;font-size:15px;margin-bottom:16px}
.lock-dots{display:flex;gap:13px;justify-content:center;margin-bottom:8px;height:15px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #7E909D;display:block}
.lock-dots i.on{background:#F2B441;border-color:#F2B441}
.lock-err{color:#F2857A;font-size:12.5px;height:18px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{height:62px;border-radius:12px;background:#333F4B;color:#E4EBF0;font-size:22px;
  border:1px solid #47545F;font-variant-numeric:tabular-nums}
.pad button:active{background:#44525F}
.pad button.wide{grid-column:span 1;font-size:15px}
.stdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--hair)}
.chip2{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:8px 12px;
  font-size:14px;min-height:38px}
.chip2.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  border-bottom:1px solid var(--hair)}
.kpi{background:var(--surface);padding:11px 13px}
.kpi i{display:block;font:normal 11px/1.2 inherit;color:var(--muted);margin-bottom:3px}
.kpi b{display:block;font:600 19px/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi b.good{color:#1B6E2B} .kpi b.bad{color:#9A3412}
.tsec{padding:13px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}
.trow{display:flex;gap:10px;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:10px 14px;align-items:baseline}
.trow span{flex:1;min-width:0;font-size:14px}
.trow em{font-style:normal;font-size:12px;color:var(--muted)}
.trow b{font:600 14px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.dates{display:flex;gap:9px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--hair)}
.dates input{flex:1;border:1px solid var(--hair);border-radius:8px;padding:9px 10px;background:#FBFCFC}
.fld{background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--hair);border-radius:8px;
  padding:9px 10px;background:#FBFCFC;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--signal);background:#fff;outline:none}

.grp{padding:14px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}

// ---------- семисегментное табло ----------
// Рисуем сегменты вручную: шрифт качать нельзя, приложение обязано жить офлайн.
const SEG_MAP = {
  '0':'abcdef', '1':'bc', '2':'abged', '3':'abgcd', '4':'fgbc',
  '5':'afgcd', '6':'afgedc', '7':'abc', '8':'abcdefg', '9':'abfgcd'
};
const D_W = 100, D_H = 180, SEG_T = 17;

function hSeg(y, x1, x2){
  const t = SEG_T/2;
  return `${x1},${y} ${x1+t},${y-t} ${x2-t},${y-t} ${x2},${y} ${x2-t},${y+t} ${x1+t},${y+t}`;
}
function vSeg(x, y1, y2){
  const t = SEG_T/2;
  return `${x},${y1} ${x+t},${y1+t} ${x+t},${y2-t} ${x},${y2} ${x-t},${y2-t} ${x-t},${y1+t}`;
}
const SEG_PTS = {
  a: hSeg(11, 13, 87), g: hSeg(90, 13, 87), d: hSeg(169, 13, 87),
  f: vSeg(13, 11, 90),  b: vSeg(87, 11, 90),
  e: vSeg(13, 90, 169),  c: vSeg(87, 90, 169),
};

function segDigit(ch, x){
  const on = SEG_MAP[ch] || '';
  let out = `<g transform="translate(${x},0)">`;
  for (const k of 'abcdefg'){
    const lit = on.includes(k);
    out += `<polygon points="${SEG_PTS[k]}" fill="${lit ? '#151D14' : '#151D14'}" `+
           `opacity="${lit ? 0.93 : 0.07}"/>`;
  }
  return out + '</g>';
}

// Табло показывает число с разрядами и знаком рубля
function segRender(num){
  const txt = fmt(num);                 // «21 915»
  let x = 0, body = '';
  for (const ch of txt){
    if (ch === ' '){ x += 42; continue; }
    body += segDigit(ch, x);
    x += D_W + 16;
  }
  // знак рубля рисуем контуром — сегментами он не собирается
  const rw = 96;
  const rub = `<g transform="translate(${x+6},0)" opacity="0.88">
    <path d="M18 18 L18 150 M18 18 L56 18 A34 34 0 0 1 56 86 L18 86 M4 112 L64 112"
      fill="none" stroke="#151D14" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>`;
  const W = x + rw;
  return `<svg viewBox="0 0 ${W} ${D_H}" xmlns="http://www.w3.org/2000/svg" `+
         `preserveAspectRatio="xMaxYMax meet" aria-hidden="true">${body}${rub}</svg>`;
}


// ---------- поворотный регулятор скидки ----------
const K_MIN = -135, K_MAX = 135, K_STEPS = 20;     // 0..100 с шагом 5
const angOf = v => K_MIN + (v/100) * (K_MAX - K_MIN);

function buildKnob(){
  let ticks = '';
  for (let i = 0; i <= K_STEPS; i++){
    const v = i*5, a = angOf(v), big = (v % 25 === 0);
    ticks += `<g transform="rotate(${a} 70 70)">`+
      `<rect x="69.1" y="${big?10:12}" width="1.8" height="${big?10:6}" rx="0.9" `+
      `fill="${big?'#C7D5E0':'#7A8794'}" data-tick="${v}"/></g>`;
    if (big){
      const rad = (a-90) * Math.PI/180, r = 66;
      ticks += `<text x="${70+r*Math.cos(rad)}" y="${70+r*Math.sin(rad)+3.4}" `+
               `text-anchor="middle" font-size="9" fill="#93A3B0" `+
               `font-family="ui-monospace,Menlo,monospace">${v}</text>`;
    }
  }
  return `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="kb" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#5A6774"/><stop offset="62%" stop-color="#3A4551"/>
        <stop offset="100%" stop-color="#232C35"/>
      </radialGradient>
      <linearGradient id="kr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6E7C89"/><stop offset="100%" stop-color="#2B343D"/>
      </linearGradient>
    </defs>
    ${ticks}
    <circle cx="70" cy="70" r="47" fill="url(#kr)"/>
    <circle cx="70" cy="70" r="43" fill="url(#kb)" stroke="#1C242B" stroke-width="1"/>
    <g id="kPtr" transform="rotate(-135 70 70)">
      <rect x="67.6" y="31" width="4.8" height="26" rx="2.4" fill="#F2B441"/>
      <circle cx="70" cy="70" r="7" fill="#20282F" stroke="#4A5561" stroke-width="1"/>
    </g>
  </svg>`;
}

function setDiscount(v){
  v = Math.max(0, Math.min(100, Math.round(v/5)*5));
  discount = v;
  dsel.value = v;
  render();
}

function paintKnob(){
  const p = document.getElementById('kPtr');
  if (p) p.setAttribute('transform', `rotate(${angOf(discount)} 70 70)`);
  const k = $('#knob');
  k.setAttribute('aria-valuenow', discount);
  k.setAttribute('aria-valuetext', discount ? discount+'%' : 'без скидки');
  $('#knobVal').textContent = discount ? discount+'%' : 'выкл';
}

function initKnob(){
  const k = $('#knob');
  k.innerHTML = buildKnob();
  let drag = false;
  const fromEvent = e => {
    const r = k.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const dx = p.clientX - (r.left + r.width/2);
    const dy = p.clientY - (r.top + r.height/2);
    let a = Math.atan2(dx, -dy) * 180/Math.PI;      // 0° — вверх
    a = Math.max(K_MIN, Math.min(K_MAX, a));
    setDiscount((a - K_MIN) / (K_MAX - K_MIN) * 100);
  };
  const down = e => { drag = true; e.preventDefault(); fromEvent(e); };
  const move = e => { if (drag){ e.preventDefault(); fromEvent(e); } };
  const up   = () => { drag = false; };
  if (window.PointerEvent){
    k.addEventListener('pointerdown', down);
    k.addEventListener('pointermove', move);
    k.addEventListener('pointerup', up);
    k.addEventListener('pointercancel', up);
  } else {
    k.addEventListener('touchstart', down, {passive:false});
    k.addEventListener('touchmove', move, {passive:false});
    k.addEventListener('touchend', up);
    k.addEventListener('mousedown', down);
    k.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }
  k.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ setDiscount(discount+5); e.preventDefault(); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown'){ setDiscount(discount-5); e.preventDefault(); }
    if (e.key === 'Home'){ setDiscount(0); e.preventDefault(); }
    if (e.key === 'End'){ setDiscount(100); e.preventDefault(); }
  });
}

          '<label class="wlab">Гарантия</label>'+
          '<select class="wsel">'+W_OPTS.map(([v,t]) =>
             '<option value="'+v+'"'+((l.w==null?'':String(l.w))===v?' selected':'')+'>'+t+'</option>').join('')+
          '</select>'+
          '<span class="wnow">'+(warranty(l)?warranty(l)+' дн.':'—')+'</span>'+
        '</div>'+
        (h?'<div class="line-hint">'+h+'</div>':'')+
      '</div><button class="line-del" aria-label="Удалить">×</button>';
    el.querySelector('.line-name').textContent = nameOf(l);
    el.querySelector('.line-cat').textContent = catOf(l);
    el.querySelector('[data-a="inc"]').onclick = () => { l.qty++; render(); };
    el.querySelector('[data-a="dec"]').onclick = () => { l.qty>1 ? l.qty-- : order.splice(idx,1); render(); };
    el.querySelector('.line-del').onclick = () => { order.splice(idx,1); render(); };
    const pe = el.querySelector('.price-edit');
    pe.onfocus = () => { pe.value = l.price; pe.select(); };
    pe.onblur = () => { const v=parseInt(String(pe.value).replace(/[^0-9]/g,''),10); l.price=isNaN(v)?0:v; render(); };
    el.querySelector('.wsel').onchange = e => { l.w = e.target.value===''?null:e.target.value; render(); };
    const ce = el.querySelector('.cost-edit');
    if (ce){
      ce.onfocus = () => { ce.value = +l.cost||0; ce.select(); };
      ce.onblur  = () => { const v=parseInt(String(ce.value).replace(/[^0-9]/g,''),10); l.cost=isNaN(v)?0:v; render(); };
    }
    el.querySelectorAll('[data-set]').forEach(b => {
      b.onclick = () => { l.price = +b.dataset.set; render(); };
    });
    box.appendChild(el);
  });
}


// ---------- выбор услуги ----------
function drawList(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#list');
  box.innerHTML = '';

  if (mode === 'part'){ drawParts(q, box); return; }

  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя позиция (запчасть, материал)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = [];
    for (let i=0;i<svcs.length && hits.length<120;i++)
      if (svcs[i].t.toLowerCase().includes(q) || svcs[i].n.startsWith(q)) hits.push(i);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Ничего не нашлось. Попробуйте другое слово.</div>');
      return;
    }
    hits.forEach(i => box.appendChild(optRow(i,true)));
    return;
  }

  if (openCat === null){
    cats.forEach((c, ci) => {
      const n = svcs.filter(s=>s.c===ci).length;
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };
      box.appendChild(b);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className='crumb';
  crumb.innerHTML = '<button id="bBack">← Разделы</button><span></span>';
  crumb.querySelector('span').textContent = cats[openCat];
  box.appendChild(crumb);
  crumb.querySelector('#bBack').onclick = () => { openCat=null; drawList(); };
  svcs.forEach((s,i) => { if (s.c===openCat) box.appendChild(optRow(i,false)); });
}

function optRow(i, withCat){
  const s = svcs[i];
  const b = document.createElement('button');
  b.className='opt';
  b.innerHTML = '<div class="opt-main"><div class="opt-t"></div>'+
                (withCat?'<div class="opt-s">'+short[s.c]+'</div>':'')+
                '</div><div class="opt-p">'+priceText(s)+'</div>';
  b.querySelector('.opt-t').textContent = s.t;
  b.onclick = () => {
    const ex = order.find(l => !l.c && l.i===i);
    if (ex) ex.qty++; else order.push({i, price:s.p, qty:1});
    render();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),320);
  };
  return b;
}

function drawParts(q, box){
  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя деталь (нет в списке)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = parts.map((p,i)=>[p,i]).filter(([p]) => p.t.toLowerCase().includes(q)).slice(0,120);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Такой детали не нашлось. Добавьте её своей строкой.</div>');
      return;
    }
    hits.forEach(([p,i]) => box.appendChild(partRow(i,true)));
    return;
  }

  if (openPCat === null){
    pcats.forEach((c, ci) => {
      const n = parts.filter(p=>p.c===ci).length;
      const b = document.createElement('button');
      b.className='opt';
      b.innerHTML='<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openPCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };
      box.appendChild(b);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className='crumb';
  crumb.innerHTML='<button id="bBackP">← Категории</button><span></span>';
  crumb.querySelector('span').textContent = pcats[openPCat];
  box.appendChild(crumb);
  crumb.querySelector('#bBackP').onclick = () => { openPCat=null; drawList(); };
  parts.forEach((p,i) => { if (p.c===openPCat) box.appendChild(partRow(i,false)); });
}

function partRow(i, withCat){
  const p = parts[i];
  const b = document.createElement('button');
  b.className='opt';
  b.innerHTML = '<div class="opt-main"><div class="opt-t"></div>'+
                (withCat?'<div class="opt-s">'+pcats[p.c]+'</div>':'')+
                '</div><div class="opt-p">'+(p.w?'гар. '+p.w+' дн.':'—')+'</div>';
  b.querySelector('.opt-t').textContent = p.t;
  b.onclick = () => {
    order.push({p:true, pc:p.c, t:p.t, price:0, qty:1, cost:0, w:String(p.w)});
    render();
    b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),320);
  };
  return b;
}

function addCustom(){
  const asPart = (mode === 'part');
  const t = prompt(asPart ? 'Название детали или материала:' : 'Название работы или услуги:');
  if (!t) return;
  const p = prompt('Цена для клиента за единицу, ₽:', '0');
  if (p === null) return;
  const v = parseInt(String(p).replace(/[^0-9]/g,''),10);
  const row = {c:true, t:t.trim(), price:isNaN(v)?0:v, qty:1, w:null};
  if (asPart){ row.p = true; row.pc = -1; row.cost = 0; }
  order.push(row);
  render();
}

$('#tabSvc').onclick = () => {
  mode='svc'; $('#tabSvc').classList.add('on'); $('#tabPart').classList.remove('on');
  $('#q').placeholder='Поиск по названию'; drawList();
};
$('#tabPart').onclick = () => {
  mode='part'; $('#tabPart').classList.add('on'); $('#tabSvc').classList.remove('on');
  $('#q').placeholder='Поиск детали'; drawList();
};
$('#q').oninput = drawList;
$('#bAdd').onclick = () => { openCat=null; $('#q').value=''; drawList(); $('#sheet').classList.add('on'); };
$('#bDone').onclick = () => $('#sheet').classList.remove('on');







// ---------- передача заказа в базу ----------
// Приложения лежат на одном адресе, поэтому хранилище у них общее.
const DBKEY = 'orders.v1';
function readStore(){
  try{ const raw = localStorage.getItem(DBKEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return null; }
}
function writeStore(v){
  try{ localStorage.setItem(DBKEY, JSON.stringify(v.slice(0,300))); return true; }
  catch(e){ return false; }
}
const HANDOFF = 'handoff.v1';

function lineName(l){ return (l.c || l.p) ? l.t : svcs[l.i].t; }

function toBase(id){
  const payload = {
    at: Date.now(),
    target: id || null,
    discount,
    lines: order.map(l => ({
      t: lineName(l), price: l.price, qty: l.qty,
      p: !!l.p, cost: +l.cost || 0, w: (l.w === undefined ? null : l.w),
      pc: (l.pc === undefined ? null : l.pc),
      pcName: l.p ? (l.pc >= 0 ? pcats[l.pc] : 'своя') : null,
      cat: (l.c || l.p) ? null : short[svcs[l.i].c],
    })),
  };
  try{ localStorage.setItem(HANDOFF, JSON.stringify(payload)); }
  catch(e){ alert('Не удалось передать заказ — в телефоне нет места для данных.'); return; }
  location.href = 'base.html#handoff';
}

function buildSend(){
  const box = $('#sendBody');
  box.innerHTML = '';

  const nw = document.createElement('button');
  nw.className = 'opt act';
  nw.innerHTML = '<div class="opt-main"><div class="opt-t">Новый заказ</div>'+
                 '<div class="opt-s">Создать карточку и заполнить данные клиента</div></div>';
  nw.onclick = () => toBase(null);
  box.appendChild(nw);

  const store = readStore();
  if (!store){
    box.insertAdjacentHTML('beforeend','<div class="none">База недоступна — телефон не разрешил хранить данные.</div>');
    return;
  }
  const open = store.filter(r => r.status !== 'closed' && r.status !== 'cancel' && r.status !== 'reject');
  if (!open.length){
    box.insertAdjacentHTML('beforeend','<div class="none">Открытых заказов пока нет.</div>');
    return;
  }
  const t = document.createElement('div');
  t.className = 'tsec'; t.textContent = 'Или добавить к существующему';
  box.appendChild(t);
  open.slice(0,40).forEach(r => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<div class="opt-main"><div class="opt-t"></div><div class="opt-s"></div></div>'+
                  '<div class="opt-p">'+fmt(r.total||0)+' ₽</div>';
    b.querySelector('.opt-t').textContent = r.client || 'Без имени';
    b.querySelector('.opt-s').textContent = r.date + ' · ' + (r.device || 'техника не указана');
    b.onclick = () => toBase(r.id);
    box.appendChild(b);
  });
}

$('#bSend').onclick = () => {
  if (!order.length){ alert('Сначала добавьте позиции.'); return; }
  buildSend();
  $('#send').classList.add('on');
};
$('#bSendClose').onclick = () => $('#send').classList.remove('on');
$('#bBase').onclick = () => { location.href = 'base.html'; };
$('#bClear').onclick = () => {
  if (order.length && !confirm('Очистить расчёт?')) return;
  order = []; discount = 0; dsel.value = 0; render();
};

$('#q').oninput = drawList;
$('#tabSvc').onclick = () => {
  mode='svc'; $('#tabSvc').classList.add('on'); $('#tabPart').classList.remove('on');
  $('#q').placeholder='Поиск по названию'; drawList();
};
$('#tabPart').onclick = () => {
  mode='part'; $('#tabPart').classList.add('on'); $('#tabSvc').classList.remove('on');
  $('#q').placeholder='Поиск детали'; drawList();
};
$('#bAdd').onclick = () => { openCat=null; $('#q').value=''; drawList(); $('#sheet').classList.add('on'); };
$('#bDone').onclick = () => $('#sheet').classList.remove('on');

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

initKnob();
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
