<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прайс">
<meta name="theme-color" content="#26303A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>Калькулятор услуг</title>
<style>
:root{
  --slab:#26303A; --slab-2:#1B242C;
  --lcd:#C9D4C5; --lcd-ink:#161E15; --lcd-dim:#5A6858;
  --bg:#E9ECEE; --surface:#FFFFFF;
  --ink:#13202A; --muted:#5E6B75; --hair:#D3D9DD;
  --signal:#0A6FB8; --danger:#B3261E;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.rig{background:var(--slab);color:#DCE3E8;position:sticky;top:0;z-index:20;
     padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.rig-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.rig-title{font-size:13px;color:#9FB0BC}
.rig-date{font-size:12px;color:#7E909D;font-variant-numeric:tabular-nums}
.readout{background:var(--lcd);border-radius:5px;padding:9px 13px 11px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.08);
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
.readout-label{font-size:11px;color:var(--lcd-dim);letter-spacing:.04em}
.readout-value{font-size:clamp(2.1rem,11.5vw,3rem);font-weight:600;color:var(--lcd-ink);
  line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  display:flex;align-items:baseline;gap:.18em}
.readout-value .cur{font-size:.42em;font-weight:500;color:var(--lcd-dim)}
.meters{display:flex;gap:1px;margin-top:9px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.meter{flex:1;background:var(--slab-2);padding:7px 9px;min-width:0}
.meter-k{font-size:10.5px;color:#8798A4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-v{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#E4EBF0;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-v.cut{color:#F2B441}
.disc{margin-top:9px;display:flex;align-items:center;gap:9px}
.disc label{font-size:12.5px;color:#9FB0BC}
.disc select{background:var(--slab-2);color:#E4EBF0;border:1px solid #3B4854;border-radius:5px;
  padding:7px 10px;min-height:var(--tap);flex:1;font-variant-numeric:tabular-nums;
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239FB0BC' stroke-width='1.8'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}

.empty{padding:52px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:17px}
.line{background:var(--surface);border-bottom:1px solid var(--hair);padding:11px 14px;display:flex;gap:11px}
.line-idx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  padding-top:3px;min-width:17px;font-variant-numeric:tabular-nums}
.line-main{flex:1;min-width:0}
.line-name{font-size:15px;line-height:1.3;margin-bottom:2px}
.line-cat{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.line-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:19px;color:var(--signal);line-height:1}
.stepper button:active{background:#EAF3FA}
.stepper span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);height:38px;line-height:38px}
.price-edit{border:1px solid var(--hair);border-radius:7px;padding:0 9px;height:38px;width:92px;
  text-align:right;font-variant-numeric:tabular-nums;background:#FBFCFC;-webkit-appearance:none}
.price-edit:focus{border-color:var(--signal);background:#fff;outline:none}
.mult{color:var(--muted);font-size:14px}
.line-sum{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.line-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.wlab{font-size:11.5px;color:var(--muted)}
.wsel{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 6px;background:#FBFCFC}
.wnow{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--hair);border-radius:7px;height:34px;padding:0 9px;
  font-size:12.5px;color:var(--signal);background:#fff;font-variant-numeric:tabular-nums}
.mini:active{background:#EAF3FA}
.seg{flex:1;height:38px;border:1px solid var(--hair);border-radius:8px;background:#fff;font-size:14.5px}
.seg.on{background:var(--signal);color:#fff;border-color:var(--signal)}
.line-del{align-self:flex-start;width:32px;height:32px;color:var(--muted);font-size:20px;line-height:1}
.line-del:active{color:var(--danger)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--hair);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.btn{min-height:var(--tap);border-radius:9px;padding:0 15px;font-size:15.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-main{background:var(--signal);color:#fff;flex:1}
.btn-main:active{background:#095C99}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);background:#fff}
.btn-ghost:active{background:#F1F4F6}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--hair);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.sheet-row{max-width:560px;margin:0 auto;display:flex;gap:9px;align-items:center}
.sheet-h{flex:1;font-size:16px;font-weight:600}
.search{flex:1;height:var(--tap);border:1px solid var(--hair);border-radius:9px;padding:0 12px;
  background:#F4F6F7;-webkit-appearance:none}
.search:focus{background:#fff;border-color:var(--signal);outline:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body-in{max-width:560px;margin:0 auto;padding-bottom:30px}
.crumb{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--muted);font-size:13px;
  background:#DFE4E7;position:sticky;top:0}
.crumb button{color:var(--signal);font-size:14px;min-height:32px}
.opt{width:100%;text-align:left;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:12px 14px;display:flex;gap:11px;align-items:center;min-height:var(--tap)}
.opt:active{background:#EAF3FA}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:15px;line-height:1.3}
.opt-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt-p{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-cnt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.opt.hit{background:#DCEFD8}
.opt.act .opt-t{color:var(--signal)}
.none{padding:38px 22px;text-align:center;color:var(--muted)}

.fld{background:var(--surface);border-bottom:1px solid var(--hair);padding:9px 14px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--hair);border-radius:8px;
  padding:9px 10px;background:#FBFCFC;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--signal);background:#fff;outline:none}
.fld textarea{min-height:64px;resize:vertical}
.grp{padding:14px 14px 5px;font-size:12px;color:var(--muted);background:var(--bg)}

/* ---------- печатный документ ---------- */
.docview{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;display:none}
.docview.on{display:block}
.docbar{position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid var(--hair);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:9px;
  max-width:190mm;margin:0 auto}
.docpage{max-width:190mm;margin:0 auto;padding:14px 14px 60px;
  font:11pt/1.38 "Times New Roman",Times,serif;color:#000}
.docpage h1{font-size:13pt;text-align:center;margin:0 0 10px}
.docpage h2{font-size:11.5pt;margin:13px 0 5px}
.docpage p{margin:0 0 6px;text-align:justify}
.docpage .fill{border-bottom:1px solid #000;display:inline-block;min-width:60px;padding:0 3px}
.docpage table{width:100%;border-collapse:collapse;margin:7px 0;font-size:10pt}
.docpage th,.docpage td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.docpage th{background:#EEE;font-weight:bold;text-align:center}
.docpage td.n,.docpage td.c{text-align:center}
.docpage td.r{text-align:right;white-space:nowrap}
.docpage .sig{display:flex;gap:18px;margin-top:16px}
.docpage .sig>div{flex:1}
.docpage .sigbox{border-bottom:1px solid #000;height:72px;margin:6px 0 2px;position:relative}
.docpage .sigpad{width:100%;height:72px;display:block;touch-action:none;cursor:crosshair}
.docpage .sigimg{max-height:68px;max-width:100%;display:block;margin-top:2px}
.docpage .sigcap{font-size:9.5pt}
.docpage .sigclr{font-size:9pt;color:#0A6FB8;padding:2px 0;text-decoration:underline}
.docpage .sighint{font-size:9pt;color:#555;margin-top:2px}
.docpage .tot{margin:8px 0}
.docpage ul{margin:4px 0 6px 18px;padding:0}
.docpage li{margin-bottom:2px}
@media print{
  body{padding:0;background:#fff}
  .rig,.bar,.wrap,.sheet{display:none!important}
  .docbar,.sigclr,.sighint{display:none!important}
  .docview.on{position:static;display:block;overflow:visible}
  .docpage{max-width:none;padding:0}
  @page{size:A4;margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="rig">
    <div class="rig-top"><span class="rig-title">Расчёт заказа</span><span class="rig-date" id="date"></span></div>
    <div class="readout">
      <div class="readout-label">Итого к оплате</div>
      <div class="readout-value"><span id="total">0</span><span class="cur">₽</span></div>
    </div>
    <div class="meters">
      <div class="meter"><div class="meter-k">Позиций</div><div class="meter-v" id="mCount">0</div></div>
      <div class="meter"><div class="meter-k">Без скидки</div><div class="meter-v" id="mGross">0 ₽</div></div>
      <div class="meter"><div class="meter-k">Скидка</div><div class="meter-v cut" id="mCut">0 ₽</div></div>
    </div>
    <div class="disc"><label for="disc">Скидка</label><select id="disc"></select></div>
  </header>
  <main id="order"></main>
</div>

<div class="bar"><div class="bar-in">
  <button class="btn btn-ghost" id="bNew">Новый</button>
  <button class="btn btn-main" id="bAdd">Добавить услугу</button>
  <button class="btn btn-ghost" id="bOut">Оформить</button>
</div></div>

<!-- выбор услуги -->
<div class="sheet" id="sheet">
  <div class="sheet-top">
    <div class="sheet-row">
      <input class="search" id="q" type="search" placeholder="Поиск по названию" autocomplete="off">
      <button class="btn btn-ghost" id="bDone">Готово</button>
    </div>
    <div class="sheet-row" style="margin-top:8px;gap:7px">
      <button class="seg on" id="tabSvc">Услуги</button>
      <button class="seg" id="tabPart">Детали</button>
    </div>
  </div>
  <div class="sheet-body"><div class="sheet-body-in" id="list"></div></div>
</div>

<!-- оформить -->
<div class="sheet" id="outs">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Оформить</span>
    <button class="btn btn-ghost" id="bOutClose">Закрыть</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="outList"></div></div>
</div>

<!-- данные клиента -->
<div class="sheet" id="form">
  <div class="sheet-top"><div class="sheet-row">
    <span class="sheet-h">Данные клиента</span>
    <button class="btn btn-ghost" id="bFormClose">Готово</button>
  </div></div>
  <div class="sheet-body"><div class="sheet-body-in" id="formBody"></div></div>
</div>

<!-- документ -->
<div class="docview" id="docview">
  <div class="docbar">
    <button class="btn btn-ghost" id="bDocClose">Закрыть</button>
    <button class="btn btn-main" id="bPrint">Печать / PDF</button>
  </div>
  <div class="docpage" id="docBody"></div>
</div>

const {cats, short, svcs, pcats, parts} = DB;

let order = [];          // {i|c, t?, price, qty}
let discount = 0;
let openCat = null;
let mode = 'svc';      // svc | part
let openPCat = null;
const C = {};            // данные клиента

const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\u00A0/g,' ');
const esc = s => String(s==null?'':s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const today = () => new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});

$('#date').textContent = today();

const dsel = $('#disc');
for (let v=0; v<=100; v+=5){
  const o=document.createElement('option');
  o.value=v; o.textContent = v===0?'без скидки':v+'%';
  dsel.appendChild(o);
}
dsel.onchange = e => { discount = +e.target.value; render(); };

// гарантия от суммы строки
function autoW(sum){ if (!sum) return 0; return sum<=5000 ? 30 : (sum<=10000 ? 60 : 90); }
function warranty(l){
  const sum = l.price*l.qty;
  return (l.w===null || l.w===undefined || l.w==='') ? autoW(sum) : +l.w;
}
const W_OPTS = [['','авто'],['0','без гар.'],['14','14 дн'],['30','30 дн'],
                ['60','60 дн'],['90','90 дн'],['180','180 дн'],['365','365 дн']];

const nameOf = l => (l.c || l.p) ? l.t : svcs[l.i].t;
const catOf  = l => l.p ? ('Деталь · '+pcats[l.pc]) : (l.c ? 'Своя позиция' : short[svcs[l.i].c]);

function priceText(s){
  if (s.k==='z') return 'бесплатно';
  if (s.k==='d') return 'договорная';
  if (s.k==='o') return 'от '+fmt(s.p)+' ₽';
  if (s.x) return fmt(s.p)+'–'+fmt(s.x)+' ₽';
  return fmt(s.p)+' ₽';
}
function hint(l){
  if (l.p) return l.price ? '' : 'Впишите цену детали';
  if (l.c) return '';
  const s = svcs[l.i];
  if (s.k==='d') return 'Цена договорная — впишите свою';
  if (s.k==='o') return 'Цена «от» — можно увеличить';
  if (s.x) return 'Вилка '+fmt(s.p)+'–'+fmt(s.x)+' ₽';
  return '';
}

function rangeBtns(l){
  if (l.c || l.p) return '';
  const s = svcs[l.i];
  if (!s.x || s.k==='o') return '';
  return '<button class="mini" data-set="'+s.p+'">мин '+fmt(s.p)+'</button>'+
         '<button class="mini" data-set="'+s.x+'">макс '+fmt(s.x)+'</button>';
}

function totals(){
  const gross = order.reduce((a,l)=>a+l.price*l.qty,0);
  const cut = Math.round(gross*discount/100);
  return {gross, cut, net: gross-cut};
}

function render(){
  const t = totals();
  $('#total').textContent = fmt(t.net);
  $('#mCount').textContent = order.length;
  $('#mGross').textContent = fmt(t.gross)+' ₽';
  $('#mCut').textContent = (t.cut?'−':'')+fmt(t.cut)+' ₽';

  const box = $('#order');
  if (!order.length){
    box.innerHTML = '<div class="empty"><b>Заказ пуст</b>Нажмите «Добавить услугу», чтобы начать расчёт.</div>';
    return;
  }
  box.innerHTML = '';
  order.forEach((l, idx) => {
    const h = hint(l);
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML =
      '<div class="line-idx">'+(idx+1)+'</div>'+
      '<div class="line-main">'+
        '<div class="line-name"></div><div class="line-cat"></div>'+
        '<div class="line-ctl">'+
          '<div class="stepper"><button data-a="dec">−</button><span>'+l.qty+'</span><button data-a="inc">+</button></div>'+
          '<input class="price-edit" inputmode="numeric" value="'+fmt(l.price)+'" aria-label="Цена">'+
          '<span class="mult">₽</span>'+

function drawList(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#list');
  box.innerHTML = '';

  if (mode === 'part'){ drawParts(q, box); return; }

  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя позиция (запчасть, материал)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = [];
    for (let i=0;i<svcs.length && hits.length<120;i++)
      if (svcs[i].t.toLowerCase().includes(q) || svcs[i].n.startsWith(q)) hits.push(i);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Ничего не нашлось. Попробуйте другое слово.</div>');
      return;
    }
    hits.forEach(i => box.appendChild(optRow(i,true)));

    cats.forEach((c, ci) => {

      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };
      box.appendChild(b);

    return;
  }

  const crumb = document.createElement('div');

  crumb.innerHTML = '<button id="bBack">← Разделы</button><span></span>';
  crumb.querySelector('span').textContent = cats[openCat];

  svcs.forEach((s,i) => { if (s.c===openCat) box.appendChild(optRow(i,false)); });
}

function drawParts(q, box){
  const own = document.createElement('button');
  own.className = 'opt act';
  own.innerHTML = '<div class="opt-main"><div class="opt-t">+ Своя деталь (нет в списке)</div>'+
                  '<div class="opt-s">Название и цену впишете сами</div></div>';
  own.onclick = addCustom;
  box.appendChild(own);

  if (q){
    const hits = parts.map((p,i)=>[p,i]).filter(([p]) => p.t.toLowerCase().includes(q)).slice(0,120);
    if (!hits.length){
      box.insertAdjacentHTML('beforeend','<div class="none">Такой детали не нашлось. Добавьте её своей строкой.</div>');
      return;
    }
    hits.forEach(([p,i]) => box.appendChild(partRow(i,true)));
    return;
  }

  if (openPCat === null){
    pcats.forEach((c, ci) => {
      const n = parts.filter(p=>p.c===ci).length;
      const b = document.createElement('button');
      b.className='opt';
      b.innerHTML='<div class="opt-main"><div class="opt-t"></div></div><div class="opt-cnt">'+n+'</div>';
      b.querySelector('.opt-t').textContent = c;
      b.onclick = () => { openPCat=ci; drawList(); document.querySelector('#sheet .sheet-body').scrollTop=0; };

  crumb.className='crumb';
  crumb.innerHTML='<button id="bBackP">← Категории</button><span></span>';
  crumb.querySelector('span').textContent = pcats[openPCat];

  crumb.querySelector('#bBackP').onclick = () => { openPCat=null; drawList(); };
  parts.forEach((p,i) => { if (p.c===openPCat) box.appendChild(partRow(i,false)); });
}

function partRow(i, withCat){

                (withCat?'<div class="opt-s">'+pcats[p.c]+'</div>':'')+

  return b;
}

function initPads(){
  const usePointer = !!window.PointerEvent;
  document.querySelectorAll('#docBody .sigpad').forEach(cv => {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 260, h = 72;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.lineWidth = 1.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#000';
    let on = false;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return [p.clientX-r.left, p.clientY-r.top];
    };
    const start = e => { e.preventDefault(); on=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
    const move  = e => { if(!on) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
    const end   = () => { on=false; };
    if (usePointer){
      cv.addEventListener('pointerdown',start);
      cv.addEventListener('pointermove',move);
      cv.addEventListener('pointerup',end);
      cv.addEventListener('pointercancel',end);
      cv.addEventListener('pointerleave',end);
    } else {
      cv.addEventListener('touchstart',start,{passive:false});
      cv.addEventListener('touchmove',move,{passive:false});
      cv.addEventListener('touchend',end);
      cv.addEventListener('mousedown',start);
      cv.addEventListener('mousemove',move);
      cv.addEventListener('mouseup',end);
    }
  });
  document.querySelectorAll('#docBody .sigclr').forEach(b => {
    b.onclick = () => {
      const cv = document.querySelector('#docBody .sigpad[data-pad="'+b.dataset.clr+'"]');
      if (cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    };
  });
}

const OUTS = [
  ['Данные клиента', 'ФИО, техника, адрес — подставятся во все документы', () => { $('#outs').classList.remove('on'); buildForm(); $('#form').classList.add('on'); }],
  ['Расчёт текстом', 'Скопировать или отправить в мессенджер', shareText],

  ['Договор на выполнение работ', 'Работы на месте, со скидкой и авансом', () => openDoc(docRabot)],
  ['Гарантийный талон', 'Со сроками гарантии по каждой позиции', () => openDoc(docTalon)],
];

function buildOuts(){
  const box = $('#outList');
  box.innerHTML = '';
  OUTS.forEach(([t,s,fn]) => {
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<div class="opt-main"><div class="opt-t">'+t+'</div><div class="opt-s">'+s+'</div></div>';
    b.onclick = fn;
    box.appendChild(b);
  });
}

function openDoc(builder){
  if (!order.length && !confirm('В заказе нет позиций. Всё равно открыть документ?')) return;
  $('#docBody').innerHTML = builder();
  $('#outs').classList.remove('on');
  $('#docview').classList.add('on');
  document.querySelector('#docview').scrollTop = 0;
  requestAnimationFrame(initPads);   // холсты меряются только после показа
}

$('#bOut').onclick = () => { buildOuts(); $('#outs').classList.add('on'); };
$('#bOutClose').onclick = () => $('#outs').classList.remove('on');
$('#bFormClose').onclick = () => { $('#form').classList.remove('on'); $('#outs').classList.add('on'); };
$('#bDocClose').onclick = () => $('#docview').classList.remove('on');
$('#bPrint').onclick = () => window.print();

// ---------- текст расчёта ----------
async function shareText(){
  if (!order.length){ alert('Заказ пуст.'); return; }
  const t = totals();
  let s = 'Расчёт работ от ' + today() + '\n\n';
  order.forEach((l,n) => {
    s += (n+1)+'. '+nameOf(l)+'\n   '+
         (l.qty>1 ? l.qty+' × '+fmt(l.price)+' ₽ = ' : '')+fmt(l.price*l.qty)+' ₽\n';
  });
  s += '\nСумма: '+fmt(t.gross)+' ₽';
  if (t.cut) s += '\nСкидка '+discount+'%: −'+fmt(t.cut)+' ₽';
  s += '\nИтого к оплате: '+fmt(t.net)+' ₽';
  s += '\n\nСавинов Д.В. — ремонт компьютеров, ТВ и смартфонов\nтел. 8-999-499-5543';
  try{
    if (navigator.share){ await navigator.share({text:s}); return; }
    await navigator.clipboard.writeText(s);
    alert('Расчёт скопирован — вставьте в мессенджер.');
  }catch(e){ alert(s); }
}

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
